# harness-resume.yml — resumes usage-paused autonomous-sdlc-harness runs once
# their usage window has reset, with no local machine involved.
#
# WHO WRITES IT. `autonomous-sdlc-harness init`, only when harness.config.json's
# `execution.target` is `github-actions`. Written create-if-absent: from then on
# it is yours to tune, and a re-run of `init` keeps your copy.
# `init --upgrade-workflows` re-renders it together with the run workflow, after
# a `.bak`, carrying its `- cron:` lines.
#
# WHY A POLLER. A `schedule` trigger is a recurring cron read from the default
# branch, not a one-shot timer, so resuming at a recorded reset time means
# polling. Each tick runs `remote-run.sh poll`: it downloads each branch's
# newest `harness run` bundle and dispatches `resume: pause` for every
# usage-paused run whose recorded reset has passed.
#
# IT DISABLES ITSELF. When a tick leaves no run waiting, `poll` runs
# `gh workflow disable harness-resume.yml`; a job that ends on a usage pause
# re-enables it (`remote-run.sh continue`). Ticks are paid only during a pause.
# That also makes moot GitHub's disabling of scheduled workflows in a public
# repository after 60 days without activity.
#
# Gate 12 round 2, on 2026-09-29, verified that `gh workflow disable` succeeds
# under GITHUB_TOKEN with `actions: write`: a hand-started tick logged
# `poll: no branch is waiting; disabled harness-resume.yml`, and the workflow's
# state became `disabled_manually`. UNVERIFIED: the enable, because no job
# ended on a usage pause. If it is refused, the pausing job's `paused`
# notification says auto-resume is unavailable, and the run waits for
# /autonomous-sdlc-harness:branch-resume.
#
# THE INTERVAL IS YOURS TO EDIT. On a private repository every tick is billed
# at least one minute while the poller is enabled: `*/30` is up to 48 minutes a
# day, `*/15` up to 96, `0 * * * *` up to 24, each adding at most its interval
# to how late a run resumes after its reset. On a public repository the ticks
# cost nothing.
#
# WHAT IT READS.
#   Secrets: HARNESS_PUSH_URL (optional notifications: the poller's own failed
#     notice when it cannot resume a run).
#   Variables: HARNESS_RUNNER, HARNESS_REMOTE_STOP (any value: the tick
#     dispatches nothing), HARNESS_MAX_CHAIN (the automatic-dispatch limit),
#     HARNESS_POLL_MAX_DISPATCH_FAILURES (failed re-dispatches of one paused
#     run before the poller gives up on it; 3 when unset) and
#     HARNESS_POLL_GIVE_UP_AFTER_MINUTES (minutes after the usage reset past
#     which it gives up; 360 when unset).
#   harness.config.json, at run time: `scriptsDir` and `stateDir`. No
#     configured value is frozen into this file.
#   The previous tick's `harness-poll-state` artifact, which `poll` downloads.
#     The job's `actions: write` covers listing and downloading its own
#     workflow's artifacts.
#
# THE PERMISSIONS. `issues: write` and `pull-requests: write` serve `poll`'s
# reports, which comment on the waiting run's issue or pull request; a
# workflow-level `permissions:` block sets every permission it does not list to
# `none`.
#
# WHAT IT WRITES. The `harness-poll-state` artifact: the failed-dispatch count
#   `poll` carries to the next tick, kept 7 days.
#
# THE RULE EVERY EDIT KEEPS. Every GitHub expression has a space after its
# opening braces, and every value reaches a shell line through `env:`. `init`
# renders this file with the CLI's double-brace token renderer, which reads a
# letter straight after the braces as a token; this file carries no token.
#
# DECLARED MIRRORS — a rename on either side is an edit to both:
#   cli/src/remote/githubActions.ts   WORKFLOW_RESUME_FILE, HARNESS_RUNNER,
#                                     HARNESS_REMOTE_STOP, HARNESS_PUSH_URL,
#                                     POLL_STATE_ARTIFACT_NAME
#   cli/src/config/model.ts           DEFAULTS.scriptsDir, DEFAULTS.stateDir
#
# ACTION PINS.
#   actions/checkout@v5
#   actions/upload-artifact@v6
# Each is the lowest major whose own action.yml declares `runs.using: node24`,
# per a maintainer's lookups of each action's action.yml and release notes on
# 2026-09-29T08:21Z (UTC). Each of those majors' release notes requires Actions
# Runner 2.327.1 or newer; a GitHub-hosted runner already has it, and a
# self-hosted one must run it (docs/remote-execution.md, section 8). A major
# tag, not a commit sha: both are GitHub's own `actions/` organisation, the
# owner of the runner and GITHUB_TOKEN this job already trusts, and a major tag
# takes the action's own patch and security releases where a sha would freeze
# your copy. Pin shas in your copy if you want them.

name: harness-resume

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  issues: write
  pull-requests: write

defaults:
  run:
    shell: bash

jobs:
  poll:
    runs-on: ${{ vars.HARNESS_RUNNER || 'ubuntu-latest' }}
    # A hand-dispatched tick overlapping a scheduled one would dispatch twice.
    concurrency:
      group: harness-resume
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      HARNESS_REMOTE_STOP: ${{ vars.HARNESS_REMOTE_STOP }}
      HARNESS_MAX_CHAIN: ${{ vars.HARNESS_MAX_CHAIN }}
      HARNESS_POLL_MAX_DISPATCH_FAILURES: ${{ vars.HARNESS_POLL_MAX_DISPATCH_FAILURES }}
      HARNESS_POLL_GIVE_UP_AFTER_MINUTES: ${{ vars.HARNESS_POLL_GIVE_UP_AFTER_MINUTES }}
      HARNESS_REMOTE_SLUG: ${{ github.repository }}
      HARNESS_PUSH_URL: ${{ secrets.HARNESS_PUSH_URL }}
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Read the configuration
        run: |
          missing=""
          for tool in jq gh; do
            command -v "$tool" >/dev/null 2>&1 || missing="$missing $tool"
          done
          if [ -n "$missing" ]; then
            echo "::error::this runner lacks:$missing. Install them on the self-hosted runner, or use a GitHub-hosted one."
            exit 1
          fi
          scripts_dir=$(jq -r '.scriptsDir // "scripts"' harness.config.json)
          state_dir=$(jq -r '.stateDir // "sdlc-harness"' harness.config.json)
          {
            echo "SCRIPTS_DIR=${scripts_dir%/}"
            echo "POLL_STATE_DIR=${state_dir%/}/autonomous_logs/poll_state/current"
          } >> "$GITHUB_ENV"

      - name: Resume the runs whose usage window has reset
        run: bash "$SCRIPTS_DIR/remote-run.sh" poll

      - name: Upload the poller state
        if: always() && env.POLL_STATE_DIR != ''
        uses: actions/upload-artifact@v6
        with:
          name: harness-poll-state
          path: ${{ env.POLL_STATE_DIR }}
          overwrite: true
          if-no-files-found: ignore
          retention-days: 7
