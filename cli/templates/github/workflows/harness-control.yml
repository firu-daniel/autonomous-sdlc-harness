# harness-control.yml — acts on an autonomous-sdlc-harness command comment
# (`@sdlc-harness answer|pause|resume|stop|clear|status`) on an issue or pull
# request, turns a pull-request review requesting changes into the next
# user-review round, and stops a run when its issue or pull request is closed
# or its branch is deleted.
#
# WHO WRITES IT. `autonomous-sdlc-harness init`, only when harness.config.json's
# `forge` is `github` and its `execution.target` is `github-actions`. Written
# create-if-absent: from then on it is yours to tune, and a re-run of `init`
# keeps your copy. `init --upgrade-workflows` does NOT re-render it: it carries
# no version pin and calls the scripts on the default branch, so it shares
# their re-run contract — `init --force` replaces it after a `.bak`. The one
# exception: any `init` replaces, after a `.bak`, a copy that is byte for byte
# the one 0.6.1 wrote, which GitHub could not parse; an edited copy of that one
# is kept and named in `init`'s output. It is a
# file of its own, apart from harness-trigger.yml, so you can disable comment
# control alone: disabling a workflow disables every event in it.
#
# WHAT IT DOES. One job runs `remote-run.sh control`, which does everything
# else: it authorises the actor — their write access, then the allow-list
# HARNESS_RUN_ACTORS — finds the run's branch, carries out the
# command or places the review round, and replies. A comment that mentions
# `@sdlc-harness` anywhere, not in the exact command form, is read by one
# read-only agent session running the plugin's mention-reading slash command,
# which `remote-run.sh control` launches and whose decision it validates.
# A comment job first asks `remote-run.sh control --needs-agent` whether that
# session would start (THE AGENT CHECK below); the act step re-checks
# everything.
# Every decision lives in that script; this file carries only the events, the
# permissions, a prefilter, the concurrency group, and on a comment job the
# credential, the agent CLI and the pinned plugin that session needs.
# The `run-name` below is not harness-run.yml's `harness <action> <branch>`
# title, so no run lookup `remote-run.sh` makes by that title can match it.
#
# THE EVENTS.
#   issue_comment, type `created` only: a command is a new comment. GitHub
#     raises it for a comment on an issue and on a pull request alike.
#   pull_request_review, type `submitted` only: the round is built from the
#     review event, which carries the review body and identifies its inline
#     comments (docs/github-integration-research.md, C1).
#   issues, type `closed` only: a run's issue was closed, which stops the run.
#   pull_request, type `closed` only: a run's pull request was closed or
#     merged, which stops the run. GitHub starts no workflow for activity on
#     a pull request with a merge conflict, so closing a conflicting one
#     stops nothing (docs/github-run-control.md, section 8).
#   delete: a branch or tag was deleted; a deleted run branch stops the run.
#   Never pull_request_review_comment: one review raises one such event per
#   inline comment, so listening to it would start one job per comment for a
#   round the review event already covers (C1).
#
# THE PREFILTER. The job's `if:` runs it only for a comment that contains
# `@sdlc-harness` and not `<!-- sdlc-harness` (the hidden line every harness
# reply carries, so a reply quoting a command is never one); for a review
# whose state is `changes_requested` on a pull request from this repository;
# for a closed issue carrying a `sdlc-harness: ` state label, which every
# harness issue carries from its trigger on; for a closed pull request from
# this repository; or for a deleted ref whose type is `branch`. Every other
# event yields a skipped job, which runs no runner and bills nothing
# (docs/remote-execution.md, `### Verified in Gate 12 round 2`). No label or
# name marks a run branch at deletion, and none reliably marks a run's pull
# request before its first lifecycle event, so every branch deletion and
# every closed same-repository pull request in the repository starts a job,
# which `control` ends in one line when the branch had no run.
# It is a saving, not the authority: `control` re-checks every rule, so an
# edited copy of this filter cannot bypass one. That `contains()` compares
# case-insensitively is GitHub's documented behaviour, not verified here; a
# mixed-case handle the filter missed would only go unanswered, never obeyed.
# The `if:` is a folded block scalar (`>-`) because its expression carries
# `: ` (the state-label prefix `'sdlc-harness: '`), which a plain scalar reads
# as a mapping indicator. 0.6.1 shipped it plain, so GitHub could not parse
# the file and ran it for no event (docs/development.md, Gate 12, Round 7,
# finding 1).
#
# THE PERMISSIONS, declared because the default token may be read-only
# (docs/github-integration-research.md, T2):
#   contents: write        push a review round, and the contents read a
#                          `stop --branch-gone` makes
#   actions: write         dispatch, pause, stop and cancel runs, and read
#                          runs and their artifacts
#   issues: write          reply on the issue or pull request, and label it
#   pull-requests: write   read the pull request, its reviews and comments,
#                          and label it
# Only an `issue_comment` event's act step receives a credential: its `env:`
# passes CLAUDE_CODE_OAUTH_TOKEN and ANTHROPIC_API_KEY as IN_OAUTH and IN_API,
# each through an expression that is the empty string unless the event is
# `issue_comment`, and nothing at job level reads a secret. A
# `pull_request_review`, `issues`, `pull_request` or `delete` event gets empty
# strings. A `pull_request_review` job runs the pull request's merge-commit
# copy of this file, which a same-repository head can edit to read the secret;
# that writer could already read it through any workflow of their own
# (docs/remote-execution.md, section 9, Credentials and billing), and a fork's
# review job gets no secret (C2). The decision of record, its exposure and why
# a comment's text cannot steer the session outside its closed set of actions:
# docs/github-run-control.md, section 6.
# Every reply is posted as github-actions[bot] and starts no workflow (S3).
#
# FORK PULL REQUESTS. Never `pull_request_target`, which would run with this
# repository's write token on a fork's event (C2).
# A `pull_request_review` job runs this file as the pull request's merge
# commit carries it (docs/github-integration-research.md, C2), so the `if:`
# that skips a fork's review is the fork's own copy: a fork that edits it is
# not skipped, and can name any `runs-on:` label, a self-hosted runner's
# included. Such a job gets a read-only token and no secret (C2), and fork
# approval policies apply to it.
# A `pull_request` close job runs the pull request's merge-commit copy of this
# file too, as a review job does (C2); the `if:` skips a fork's.
# A comment on a fork's pull request runs with a write token, and `control`
# refuses it.
# The checkout is always the default branch, never the pull request's merge
# commit a `pull_request_review` job checks out by default, so the script that
# decides is always the default branch's; what a pull request's head can change
# is this file's own definition for its own review events.
#
# THE CONCURRENCY GROUP SERIALIZES REVIEW JOBS PER BRANCH, NEVER COMMENT JOBS.
#   * A comment job's group is its own run id, so it never waits and is never
#     replaced: a group keeps at most one pending job and cancels an earlier
#     pending one, which would drop a command. A close or deletion job takes
#     the same run-id group, for the same reason.
#   * Review jobs on one head branch share `harness-review-<branch>` and run one
#     at a time, so two reviews submitted together give one round, not two
#     pushes racing for the same round number.
#   * A pending review job replaced by a newer one loses nothing: every job in
#     the group collects cumulatively, every review requesting changes, every
#     other review carrying a summary and every inline comment no earlier round
#     recorded, and the round's comment names
#     every reviewer it took.
#   * The name `harness-review-<branch>` is reserved for every job that places a
#     review round on that branch; any other workflow's job that does so joins
#     the group under exactly that name, and both files' headers declare it.
#     harness-run.yml's `collect` job is the one such job today (DECLARED
#     MIRRORS below).
#
# THE PLUGIN. This file carries no pin of its own. A comment job reads the
# first HARNESS_CLI_VERSION in the checkout's harness-run.yml, clones the
# release tag `autonomous-sdlc-harness--v<that version>` outside the checkout
# as harness-run.yml's `Install the pinned plugin` step does, checks the
# plugin manifest's version against it, and hands the plugin's directory to
# the act step as HARNESS_MENTION_PLUGIN_DIR; the session loads it with
# `--plugin-dir`, so nothing is installed. The plugin a mention runs under is
# therefore the release the run job installs. A pinned release older than
# mentions carries no mention-reading command and gets `control`'s no-plugin
# reply; the route is `init --upgrade-workflows` (docs/remote-execution.md,
# `### Upgrading`). The three comment-only steps run only when THE AGENT CHECK
# below did not answer `no`, so an exact-form command now skips them. They stay
# `continue-on-error`, so a failed install still never blocks one: `control`
# then finds no agent binary or plugin and answers a mention with its exit-3
# reply.
#
# THE AGENT CHECK. A comment job runs `remote-run.sh control --needs-agent`
# before the three comment-only steps. It tells the exact command form apart
# from a mention, then runs `control`'s gates 1 to 3 on a mention, and posts,
# dispatches and writes nothing. Only its exit 2 (no session would start: an
# ignored comment, an exact-form command or a refused commenter) writes
# `agent=no`, which skips those steps. Every other outcome installs, as
# before: an older script that does not know the flag, a failed permission
# call, a failed step. A mention by an admitted commenter costs one extra
# permission call. It is a saving, not the authority, as THE PREFILTER says of
# the `if:`: the act step re-checks every rule.
#
# A REFUSAL IS A SUCCESS. `remote-run.sh control` exits 2 for a refusal it has
# already replied to; that exit code is the script's contract with every other
# caller, so the step, not the script, maps it: `|| [ $? -eq 2 ]` turns a
# replied refusal into a green job with no failure e-mail, while 1, 3 and 4
# still fail it. Under the step's `bash -e -o pipefail` a failure on the left
# of `||` does not exit the shell, and `$?` is the script's status.
#

# THREE RULES EVERY EDIT KEEPS.
#   * Event text and variables reach a shell line only through `env:` and the
#     event file, never through a GitHub expression inside `run:` — a comment
#     body is written by whoever posted it (script injection).
#   * Every GitHub expression has a space after its opening braces. `init`
#     renders its workflows with the CLI's double-brace token renderer, which
#     reads a letter straight after the braces as a token; this file carries
#     no token.
#   * A value carrying `: ` or ` #` is never a plain scalar: write it as a
#     block scalar (`>-`) or quote it. A plain scalar reads `: ` as a mapping
#     indicator, which leaves the file unparseable, and ` #` as a comment,
#     which silently truncates the value (THE PREFILTER above).
#
# DECLARED MIRRORS — a rename on either side is an edit to both:
#   cli/src/remote/githubActions.ts   WORKFLOW_CONTROL_FILE, COMMAND_HANDLE
#                                     (`@sdlc-harness`), COMMENT_MARKER
#                                     (`<!-- sdlc-harness`), REVIEW_ROUND_STATE
#                                     (`changes_requested`), HARNESS_RUNNER,
#                                     HARNESS_REMOTE_STOP,
#                                     HARNESS_TRIGGER_ALLOWED_BOTS,
#                                     HARNESS_RUN_ACTORS,
#                                     OAUTH_TOKEN_SECRET
#                                     (`CLAUDE_CODE_OAUTH_TOKEN`),
#                                     API_KEY_SECRET (`ANTHROPIC_API_KEY`),
#                                     CLI_VERSION_VARIABLE
#                                     (`HARNESS_CLI_VERSION`, read from
#                                     harness-run.yml)
#   cli/src/generators/projectSettings.ts   MARKETPLACE_NAME
#                                     (`autonomous-sdlc-harness`)
#   cli/src/config/model.ts           DEFAULTS.scriptsDir
#   harness-run.yml                   the concurrency group
#                                     `harness-review-<branch>`, held by its
#                                     `collect` job; the release-tag shape
#                                     `autonomous-sdlc-harness--v<version>`
#                                     of its `Install the pinned plugin` step
#   remote-run.sh (the scriptsDir copy) IN_OAUTH, IN_API and
#                                     HARNESS_MENTION_PLUGIN_DIR, the env
#                                     interface `control` reads (its MENTION
#                                     paragraph); `control --needs-agent`,
#                                     whose exit 2 alone means no session
#                                     would start
#
# ACTION PINS.
#   actions/checkout@v5
#   actions/setup-node@v5
# Each is the lowest major whose own action.yml declares `runs.using: node24`,
# per a maintainer's lookups of each action's action.yml and release notes on
# 2026-09-29T08:21Z (UTC). Each of those majors' release notes requires
# Actions Runner 2.327.1 or newer; a GitHub-hosted runner already has it, and
# a self-hosted one must run it (docs/remote-execution.md, section 8). A major
# tag, not a commit sha: every action here is GitHub's own `actions/`
# organisation, the owner of the runner and GITHUB_TOKEN this job already
# trusts, and a major tag takes the action's own patch and security releases
# where a sha would freeze your copy. Pin shas in your copy if you want them.

name: harness-control
run-name: harness control ${{ github.event.issue.number || github.event.pull_request.number || github.event.ref }}

on:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [closed]
  pull_request:
    types: [closed]
  delete:

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: write

defaults:
  run:
    shell: bash

jobs:
  control:
    if: >-
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@sdlc-harness') && !contains(github.event.comment.body, '<!-- sdlc-harness')) || (github.event_name == 'pull_request_review' && github.event.review.state == 'changes_requested' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'issues' && contains(join(github.event.issue.labels.*.name, ','), 'sdlc-harness: ')) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'delete' && github.event.ref_type == 'branch')
    runs-on: ${{ vars.HARNESS_RUNNER || 'ubuntu-latest' }}
    concurrency:
      group: ${{ github.event_name == 'pull_request_review' && format('harness-review-{0}', github.event.pull_request.head.ref) || format('harness-control-{0}', github.run_id) }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      HARNESS_REMOTE_STOP: ${{ vars.HARNESS_REMOTE_STOP }}
      HARNESS_REMOTE_SLUG: ${{ github.repository }}
      HARNESS_TRIGGER_ALLOWED_BOTS: ${{ vars.HARNESS_TRIGGER_ALLOWED_BOTS }}
      HARNESS_RUN_ACTORS: ${{ vars.HARNESS_RUN_ACTORS }}
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ github.token }}
          fetch-depth: 0

      - name: Check for jq and gh
        run: |
          missing=""
          for tool in jq gh; do
            command -v "$tool" >/dev/null 2>&1 || missing="$missing $tool"
          done
          if [ -n "$missing" ]; then
            echo "::error::this runner lacks:$missing. Install them on the self-hosted runner, or use a GitHub-hosted one."
            exit 1
          fi

      - name: Read the configuration
        run: |
          scripts_dir=$(jq -r '.scriptsDir // "scripts"' harness.config.json)
          echo "SCRIPTS_DIR=${scripts_dir%/}" >> "$GITHUB_ENV"

      - name: Set the git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Decide whether the comment needs the agent
        id: needs
        if: github.event_name == 'issue_comment'
        continue-on-error: true
        run: |
          status=0
          bash "$SCRIPTS_DIR/remote-run.sh" control --needs-agent || status=$?
          if [ "$status" -eq 2 ]; then
            echo "agent=no" >> "$GITHUB_OUTPUT"
          else
            echo "agent=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: github.event_name == 'issue_comment' && steps.needs.outputs.agent != 'no'
        continue-on-error: true
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          # As in harness-run.yml: no npm cache is used, and a lockfile-less repository must not fail this step.
          package-manager-cache: false

      - name: Install the claude CLI when absent
        if: github.event_name == 'issue_comment' && steps.needs.outputs.agent != 'no'
        continue-on-error: true
        run: |
          if ! command -v claude >/dev/null 2>&1; then
            npm install -g @anthropic-ai/claude-code
          fi
          claude --version

      - name: Fetch the pinned plugin
        if: github.event_name == 'issue_comment' && steps.needs.outputs.agent != 'no'
        continue-on-error: true
        run: |
          pin=$(awk '/^[[:space:]]*HARNESS_CLI_VERSION:/ { sub(/^[[:space:]]*HARNESS_CLI_VERSION:[[:space:]]*/, ""); sub(/[[:space:]]+#.*$/, ""); sub(/[[:space:]]+$/, ""); gsub(/["\047]/, ""); print; exit }' .github/workflows/harness-run.yml 2>/dev/null || true)
          if [ -z "$pin" ]; then
            echo "::warning::.github/workflows/harness-run.yml carries no HARNESS_CLI_VERSION, so no plugin was fetched and a mention gets the no-plugin reply."
            exit 1
          fi
          source_repo=$(jq -r '.extraKnownMarketplaces["autonomous-sdlc-harness"].source.repo // empty' .claude/settings.json 2>/dev/null || true)
          if [ -z "$source_repo" ]; then
            echo "::warning::.claude/settings.json names no marketplace source for autonomous-sdlc-harness, so the plugin at $pin was not fetched."
            exit 1
          fi
          tag="autonomous-sdlc-harness--v$pin"
          marketplace_dir="$RUNNER_TEMP/harness-marketplace"
          # --quiet does not cover the detached-HEAD advice a tag checkout prints; only advice.detachedHead gates it.
          if ! git -c advice.detachedHead=false clone --quiet --depth 1 --branch "$tag" "https://github.com/$source_repo.git" "$marketplace_dir"; then
            echo "::warning::$source_repo has no release tag $tag, so the plugin at $pin was not fetched."
            exit 1
          fi
          plugin_source=$(jq -r '[.plugins[]? | select(.name == "autonomous-sdlc-harness") | .source | strings][0] // empty' "$marketplace_dir/.claude-plugin/marketplace.json" 2>/dev/null || true)
          if [ -z "$plugin_source" ]; then
            echo "::warning::$tag's .claude-plugin/marketplace.json has no readable autonomous-sdlc-harness entry, so the plugin at $pin was not handed to the mention session."
            exit 1
          fi
          plugin_dir="$marketplace_dir/${plugin_source#./}"
          version=$(jq -r '.version // empty' "$plugin_dir/.claude-plugin/plugin.json" 2>/dev/null || true)
          if [ "$version" != "$pin" ]; then
            echo "::warning::the plugin cloned at $tag is version '${version:-none}', not $pin, so it was not handed to the mention session."
            exit 1
          fi
          echo "HARNESS_MENTION_PLUGIN_DIR=$plugin_dir" >> "$GITHUB_ENV"

      - name: Act on the comment, review, close or deletion
        env:
          IN_OAUTH: ${{ github.event_name == 'issue_comment' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          IN_API: ${{ github.event_name == 'issue_comment' && secrets.ANTHROPIC_API_KEY || '' }}
        run: bash "$SCRIPTS_DIR/remote-run.sh" control || [ $? -eq 2 ]
