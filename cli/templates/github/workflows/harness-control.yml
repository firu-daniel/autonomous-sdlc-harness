# harness-control.yml — acts on an autonomous-sdlc-harness command comment
# (`@sdlc-harness answer|pause|resume|stop|clear|status`) on an issue or pull
# request, turns a pull-request review requesting changes into the next
# user-review round, and stops a run when its issue or pull request is closed
# or its branch is deleted.
#
# WHO WRITES IT. `autonomous-sdlc-harness init`, only when harness.config.json's
# `forge` is `github` and its `execution.target` is `github-actions`. Written
# create-if-absent: from then on it is yours to tune, and a re-run of `init`
# keeps your copy. `init --upgrade-workflows` does NOT re-render it: it carries
# no version pin and calls the scripts on the default branch, so it shares
# their re-run contract — `init --force` replaces it after a `.bak`. It is a
# file of its own, apart from harness-trigger.yml, so you can disable comment
# control alone: disabling a workflow disables every event in it.
#
# WHAT IT DOES. One job runs `remote-run.sh control`, which does everything
# else: it authorises the actor, finds the run's branch, carries out the
# command or places the review round, and replies. Every decision lives in that
# script; this file carries only the events, the permissions, a prefilter and
# the concurrency group.
# The `run-name` below is not harness-run.yml's `harness <action> <branch>`
# title, so no run lookup `remote-run.sh` makes by that title can match it.
#
# THE EVENTS.
#   issue_comment, type `created` only: a command is a new comment. GitHub
#     raises it for a comment on an issue and on a pull request alike.
#   pull_request_review, type `submitted` only: the round is built from the
#     review event, which carries the review body and identifies its inline
#     comments (docs/github-integration-research.md, C1).
#   issues, type `closed` only: a run's issue was closed, which stops the run.
#   pull_request, type `closed` only: a run's pull request was closed or
#     merged, which stops the run.
#   delete: a branch or tag was deleted; a deleted run branch stops the run.
#   Never pull_request_review_comment: one review raises one such event per
#   inline comment, so listening to it would start one job per comment for a
#   round the review event already covers (C1).
#
# THE PREFILTER. The job's `if:` runs it only for a comment that contains
# `@sdlc-harness` and not `<!-- sdlc-harness` (the hidden line every harness
# reply carries, so a reply quoting a command is never one); for a review
# whose state is `changes_requested` on a pull request from this repository;
# for a closed issue carrying a `sdlc-harness: ` state label, which every
# harness issue carries from its trigger on; for a closed pull request from
# this repository; or for a deleted ref whose type is `branch`. Every other
# event yields a skipped job, which runs no runner and bills nothing
# (docs/remote-execution.md, `### Verified in Gate 12 round 2`). No label or
# name marks a run branch at deletion, and none reliably marks a run's pull
# request before its first lifecycle event, so every branch deletion and
# every closed same-repository pull request in the repository starts a job,
# which `control` ends in one line when the branch had no run.
# It is a saving, not the authority: `control` re-checks every rule, so an
# edited copy of this filter cannot bypass one. That `contains()` compares
# case-insensitively is GitHub's documented behaviour, not verified here; a
# mixed-case handle the filter missed would only go unanswered, never obeyed.
#
# THE PERMISSIONS, declared because the default token may be read-only
# (docs/github-integration-research.md, T2):
#   contents: write        push a review round, and the contents read a
#                          `stop --branch-gone` makes
#   actions: write         dispatch, pause, stop and cancel runs, and read
#                          runs and their artifacts
#   issues: write          reply on the issue or pull request, and label it
#   pull-requests: write   read the pull request, its reviews and comments,
#                          and label it
# The job reads no repository secret: it needs only its own token, so the
# credential secrets never reach the job that reads untrusted comment text.
# Every reply is posted as github-actions[bot] and starts no workflow (S3).
#
# FORK PULL REQUESTS. Never `pull_request_target`, which would run with this
# repository's write token on a fork's event (C2).
# A `pull_request_review` job runs this file as the pull request's merge
# commit carries it (docs/github-integration-research.md, C2), so the `if:`
# that skips a fork's review is the fork's own copy: a fork that edits it is
# not skipped, and can name any `runs-on:` label, a self-hosted runner's
# included. Such a job gets a read-only token and no secret (C2), and fork
# approval policies apply to it.
# A `pull_request` close job runs the pull request's merge-commit copy of this
# file too, as a review job does (C2); the `if:` skips a fork's.
# A comment on a fork's pull request runs with a write token, and `control`
# refuses it.
# The checkout is always the default branch, never the pull request's merge
# commit a `pull_request_review` job checks out by default, so the script that
# decides is always the default branch's; what a pull request's head can change
# is this file's own definition for its own review events.
#
# THE CONCURRENCY GROUP SERIALIZES REVIEW JOBS PER BRANCH, NEVER COMMENT JOBS.
#   * A comment job's group is its own run id, so it never waits and is never
#     replaced: a group keeps at most one pending job and cancels an earlier
#     pending one, which would drop a command. A close or deletion job takes
#     the same run-id group, for the same reason.
#   * Review jobs on one head branch share `harness-review-<branch>` and run one
#     at a time, so two reviews submitted together give one round, not two
#     pushes racing for the same round number.
#   * A pending review job replaced by a newer one loses nothing: every job in
#     the group collects cumulatively, every review requesting changes, every
#     other review carrying a summary and every inline comment no earlier round
#     recorded, and the round's comment names
#     every reviewer it took.
#   * The name `harness-review-<branch>` is reserved for every job that places a
#     review round on that branch; any other workflow's job that does so joins
#     the group under exactly that name, and both files' headers declare it.
#     harness-run.yml's `collect` job is the one such job today (DECLARED
#     MIRRORS below).
#
# A REFUSAL IS A SUCCESS. `remote-run.sh control` exits 2 for a refusal it has
# already replied to; that exit code is the script's contract with every other
# caller, so the step, not the script, maps it: `|| [ $? -eq 2 ]` turns a
# replied refusal into a green job with no failure e-mail, while 1, 3 and 4
# still fail it. Under the step's `bash -e -o pipefail` a failure on the left
# of `||` does not exit the shell, and `$?` is the script's status.
#

# TWO RULES EVERY EDIT KEEPS.
#   * Event text and variables reach a shell line only through `env:` and the
#     event file, never through a GitHub expression inside `run:` — a comment
#     body is written by whoever posted it (script injection).
#   * Every GitHub expression has a space after its opening braces. `init`
#     renders its workflows with the CLI's double-brace token renderer, which
#     reads a letter straight after the braces as a token; this file carries
#     no token.
#
# DECLARED MIRRORS — a rename on either side is an edit to both:
#   cli/src/remote/githubActions.ts   WORKFLOW_CONTROL_FILE, COMMAND_HANDLE
#                                     (`@sdlc-harness`), COMMENT_MARKER
#                                     (`<!-- sdlc-harness`), REVIEW_ROUND_STATE
#                                     (`changes_requested`), HARNESS_RUNNER,
#                                     HARNESS_REMOTE_STOP,
#                                     HARNESS_TRIGGER_ALLOWED_BOTS
#   cli/src/config/model.ts           DEFAULTS.scriptsDir
#   harness-run.yml                   the concurrency group
#                                     `harness-review-<branch>`, held by its
#                                     `collect` job
#
# ACTION PINS.
#   actions/checkout@v5
# The lowest major whose own action.yml declares `runs.using: node24`, per a
# maintainer's lookups of its action.yml and release notes on
# 2026-09-29T08:21Z (UTC). That major's release notes require Actions Runner
# 2.327.1 or newer; a GitHub-hosted runner already has it, and a self-hosted
# one must run it (docs/remote-execution.md, section 8). A major tag, not a
# commit sha: it is GitHub's own `actions/` organisation, the owner of the
# runner and GITHUB_TOKEN this job already trusts, and a major tag takes the
# action's own patch and security releases where a sha would freeze your copy.
# Pin a sha in your copy if you want one.

name: harness-control
run-name: harness control ${{ github.event.issue.number || github.event.pull_request.number || github.event.ref }}

on:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [closed]
  pull_request:
    types: [closed]
  delete:

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: write

defaults:
  run:
    shell: bash

jobs:
  control:
    if: (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@sdlc-harness') && !contains(github.event.comment.body, '<!-- sdlc-harness')) || (github.event_name == 'pull_request_review' && github.event.review.state == 'changes_requested' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'issues' && contains(join(github.event.issue.labels.*.name, ','), 'sdlc-harness: ')) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'delete' && github.event.ref_type == 'branch')
    runs-on: ${{ vars.HARNESS_RUNNER || 'ubuntu-latest' }}
    concurrency:
      group: ${{ github.event_name == 'pull_request_review' && format('harness-review-{0}', github.event.pull_request.head.ref) || format('harness-control-{0}', github.run_id) }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      HARNESS_REMOTE_STOP: ${{ vars.HARNESS_REMOTE_STOP }}
      HARNESS_REMOTE_SLUG: ${{ github.repository }}
      HARNESS_TRIGGER_ALLOWED_BOTS: ${{ vars.HARNESS_TRIGGER_ALLOWED_BOTS }}
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ github.token }}
          fetch-depth: 0

      - name: Check for jq and gh
        run: |
          missing=""
          for tool in jq gh; do
            command -v "$tool" >/dev/null 2>&1 || missing="$missing $tool"
          done
          if [ -n "$missing" ]; then
            echo "::error::this runner lacks:$missing. Install them on the self-hosted runner, or use a GitHub-hosted one."
            exit 1
          fi

      - name: Read the configuration
        run: |
          scripts_dir=$(jq -r '.scriptsDir // "scripts"' harness.config.json)
          echo "SCRIPTS_DIR=${scripts_dir%/}" >> "$GITHUB_ENV"

      - name: Set the git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Act on the comment, review, close or deletion
        run: bash "$SCRIPTS_DIR/remote-run.sh" control || [ $? -eq 2 ]
