# devscene-run.yml — runs one devscene run in a GitHub Actions job,
# on a GitHub-hosted or a self-hosted runner chosen by the DEVSCENE_RUNNER variable.
#
# WHO WRITES IT. `devscene init`, only when devscene.config.json's
# `execution.target` is `github-actions`. Written create-if-absent: from then on
# it is yours to tune, and a re-run of `init` keeps your copy.
# `init --upgrade-workflows` re-renders it at that CLI's version, after a `.bak`,
# and only when the DEVSCENE_CLI_VERSION below differs.
#
# THE INPUT CONTRACT. Composed on the shell side by `remote-run.sh` alone:
#   action           run | pause | warm | stop. Only `run` and `warm` start a
#                    job; `pause` and `stop` are jobless, titled marker runs,
#                    except a `pause` from the wrong ref (THE REF CHECK)
#   branch           the run's branch (for warm: GitHub's default branch)
#   engine           task | user_review | docs                (action=run)
#   resume           none | answer | pause                    (action=run)
#   answers          JSON object {"<n>": "<answer text>"}     (resume=answer)
#   park_loop_clear  true clears the restored park-loop count
#   chain            automatic dispatches since the last user action; 0 from a user
# `run-name` is `devscene <action> <branch>`: the job's pause poll and
# `remote-run.sh continue` / `poll` match runs by that title, so it is a wire.
#
# TWO RULES EVERY EDIT KEEPS.
#   * Every input, variable and secret reaches a shell line through `env:`, never
#     through a GitHub expression inside `run:` — an interpolated input is shell
#     source (script injection).
#   * Every GitHub expression has a space after its opening braces. `init`
#     renders this file with the CLI's double-brace token renderer, which reads
#     a letter straight after the braces as a token; the only token here is the
#     CLI version, DEVSCENE_CLI_VERSION in each job's `env:`.
#
# DECLARED MIRRORS — a rename on either side is an edit to both:
#   cli/src/remote/githubActions.ts   the file names, DEVSCENE_RUNNER,
#                                     DEVSCENE_REMOTE_STOP, CLAUDE_CODE_OAUTH_TOKEN,
#                                     ANTHROPIC_API_KEY, DEVSCENE_PUSH_URL,
#                                     DEVSCENE_GIT_TOKEN, the artifact harness-state,
#                                     DEVSCENE_CLI_VERSION, DEVSCENE_RUN_ACTORS,
#                                     DEVSCENE_TRIGGER_ALLOWED_BOTS
#   cli/src/generators/githubWorkflows.ts   --upgrade-workflows
#   cli/src/generators/projectSettings.ts   the marketplace and plugin key
#                                     devscene@devscene
#   cli/src/config/model.ts           DEFAULTS.scriptsDir and retrievalApplies
#   cli/src/machine/paths.ts          machineCacheDir, under which the retrieval
#                                     runtime sits in `retrieval/`
#   cli/src/retrieval/runtime.ts      RETRIEVAL_CACHE_DIRNAME, that `retrieval/`
#   cli/src/doctor/sandboxPrerequisites.ts SANDBOX_INSTALLERS' families in its
#                                     order (apt-get, then dnf),
#                                     SANDBOX_HOST_BINARIES' packages,
#                                     APPARMOR_USERNS_SYSCTL_PATH,
#                                     BWRAP_APPARMOR_PROFILE_PATH,
#                                     bwrapAppArmorProfile(),
#                                     BWRAP_USERNS_RESTRICT_PROFILE_PATH,
#                                     APPARMOR_DISABLE_DIR,
#                                     bwrapUsernsRestrictRemedy(),
#                                     APPARMOR_LOAD_COMMAND, NESTED_USERNS_PROBE
#                                     and NESTED_USERNS_HELPER (the `command -v
#                                     unshare` gate before the verification), in
#                                     `Install the sandbox prerequisites`, held
#                                     by workflow-sandbox-install.test.mjs
#   remote-run.sh (the scriptsDir copy) RUN_JOB_NAME (`run`): the `run` job has no
#                                     `name:`, so GitHub names it by its key,
#                                     and the settledness test reads that
#                                     job's status by that name
#   lib/harness-run-lib.sh (the scriptsDir copy) hr_sandbox_opted_out, sourced
#                                     in a subshell from $SCRIPTS_DIR/lib/ by
#                                     `Install the sandbox prerequisites` to
#                                     read sandbox.optOut on its failing arm,
#                                     held by workflow-sandbox-install.test.mjs
#   devscene-control.yml              the concurrency group
#                                     `harness-review-<branch>`, shared by its
#                                     review jobs and the `collect` job here;
#                                     and, read by its `Fetch the pinned
#                                     plugin` step, the first
#                                     `DEVSCENE_CLI_VERSION:` env line (key, then
#                                     the quoted version) and the release-tag
#                                     shape `devscene--v<version>`
#                                     of the `Install the pinned plugin` step
#
# THE COLLECT JOB. When a run ends, `remote-run.sh collect` starts the next
# user-review round from every review requesting changes that `control`
# answered "collected" while the run was in flight, so a reviewer waits at most
# for that run and never resubmits. It is a job of its own, not a step of
# `run`, for two reasons: a step cannot hold a concurrency group, and this one
# must share `harness-review-<branch>` with devscene-control.yml's review jobs so
# the two never place a round at once; and the settledness test reads "the
# `run` job is completed", which no step inside that job could see. Under
# `!cancelled()` a failed `run` job still reaches it, and the run's state bundle
# decides whether the run ended or only paused or parked. A `run` job GitHub
# cancelled before any step ran, for example one no runner acquired, reaches it
# too, and `collect` reports that run once (remote-run.sh's header, its
# `collect` paragraph), because the job itself could report nothing; a workflow
# run cancelled or stopped as a whole skips it. The group name mirrors devscene-control.yml's, and
# RUN_JOB_NAME in remote-run.sh mirrors the `run` job's key (DECLARED MIRRORS
# above). It reads no secret: its own token pushes the round, dispatches it and
# comments. It checks out the default branch, as devscene-control.yml's review
# jobs do, never the run's branch: `collect` fetches that branch itself and
# `review` cuts its own working copy of it, which create-worktree.sh refuses
# for a branch already checked out. Its step is `continue-on-error` for the
# report step's reason below: scripts older than this file carry no `collect`
# verb. It is `needs: [run, deliver]` under the same `!cancelled()`, reading no
# job's result, so a round is never collected before its delivery flipped the
# pull request, and a failed or skipped `deliver` still reaches it.
#
# THE REF CHECK. Finding 6 of Gate 12 round 6: GitHub lists a run under the ref
# it was dispatched from (Use workflow from), so a run or pause dispatched from
# a ref other than its `branch` input is invisible to every lookup by that
# branch. When `action` is `run` or `pause` and `github.ref_name` is not
# `inputs.branch`, the `wrong-ref` job fails, naming the ref to use, and `open`,
# `run`, `deliver` and `collect` are skipped; the jobless `pause` marker gains that failing job
# only when its ref is wrong. `warm` is exempt because it dispatches on the
# default branch with that branch as its input, so the two already agree.
# `stop` is exempt because a deleted branch's stop marker is sent from the
# default branch, its own ref being gone, and the stop check matches the
# `devscene stop <branch>` title across every branch's runs, under any ref.
#
# THE RUN-ACTOR GATE. The first step of `open`, `run`, `deliver` and `collect`,
# byte-identical in all four, refuses a `github.triggering_actor` the repository
# variable DEVSCENE_RUN_ACTORS does not admit, so the Run workflow form, `gh
# workflow run` and a re-run by someone not on the list launch nothing; a
# refused job sets no SCRIPTS_DIR, so its `always()` and `!cancelled()` steps
# skip too, and a `run` reached after a refused `open` is refused by its own
# gate. The list:
# split on `,`, each entry trimmed, empty entries dropped, matched
# case-insensitively, `*` admitting every writer; an empty list admits the owner
# of a user-owned repository alone, and nobody otherwise.
#   * A step, not a job: Re-run failed jobs and Re-run job do not re-run an
#     upstream job that succeeded, so a gate job would never see the re-runner's
#     triggering_actor (docs/team-accounts-research.md, G2).
#   * `github-actions[bot]` passes: every harness dispatch is made with
#     GITHUB_TOKEN and names it. Measured 2026-10-05 for the trigger, the comment
#     commands and `collect`; inferred for the `remote-run.sh continue` chain and
#     the devscene-resume.yml poller, which Gate 12 observation (xv) confirms.
#   * Not closed: a writer who edits this file on a branch can remove the gate
#     or dispatch as the bot. That writer can already read the secret (G7).
#   * Resolved before it: `run`'s job-level DEVSCENE_PUSH_URL secret, at job
#     start. The credential secrets are read only by later `run` steps, and
#     DEVSCENE_GIT_TOKEN only by the last step of `open` and of `deliver`.
#
# THE JOB'S OWN FILES. `Check out the run's branch` checks out the run's branch,
# and every later step runs or loads that tree's files: its scriptsDir scripts,
# devscene.config.json, .claude/settings.json and .mcp.json. A previous job's
# agent can commit any of them. `Refuse a branch that changed the job's own
# files` runs the pinned CLI's `doctor --job-surfaces=<default branch>`, which
# reads the trusted configuration from the GitHub default branch, the branch
# the `collect` job already reads its configuration from, and fails when the
# branch's own commits changed a job surface, naming each path.
#   * It runs before `Read the configuration`, the only `run` step that sets
#     SCRIPTS_DIR: a refusal, or any other failure of the step, leaves it unset,
#     so no `always()`, `!cancelled()` or `cancelled()` step runs a script from
#     the refused tree, as with THE RUN-ACTOR GATE.
#   * A refused job ends `failure`, with one `::error::` annotation over the
#     doctor report. It saves no state bundle, so `remote-run.sh sync` and
#     `status` map the run by their no-bundle rule and nothing chains, and it
#     sends no notification: every notify path is a script in the refused tree.
#   * `Record the default branch's commit` writes that branch's commit id to
#     HARNESS_GITHUB_DEFAULT_COMMIT before any session: the session can later
#     rewrite the checkout's refs/remotes/origin/*, and the watcher's job-mode
#     watchdog takes its check's configuration from that id. It writes the
#     configured defaultBranch's commit to HARNESS_DEFAULT_BRANCH_COMMIT, the
#     merge-base side, which differs from the GitHub default branch's when the
#     two branches differ.
#   * Every `run` step running npm or npx runs from $RUNNER_TEMP and names the
#     checkout with `--cwd "$GITHUB_WORKSPACE"`: a branch's .npmrc or
#     node_modules/ is not a job surface, and npm would read it from the checkout.
#   * Stated residuals. This file itself runs as the branch carries it
#     (docs/remote-execution.md, section 9). `Bootstrap the checkout`'s
#     configured commands.depInstall and commands.build run against the
#     branch's own manifest, unsandboxed: a package manager runs a manifest's
#     lifecycle and script entries by nature, and no out-of-session sandbox
#     runtime ships. They are the npm runs left in the checkout, so both still
#     read a branch-written .npmrc or node_modules/.
#
# WHY THE RUN JOB CUTS NO RUN COPY. `Run DevScene` runs
# `autonomous-watcher.sh job` in the job's own checkout, $GITHUB_WORKSPACE,
# which job mode treats as both the main checkout and the run's working copy
# (that script's anchors comment and its JOB MODE). So no step creates a run
# copy and none needs the clone layout: on a runner that runs exactly one run, a
# clone would add a copy and a sync for a checkout nothing else shares.
#   * The profile `Generate the job's permission profile` writes denies writes to
#     that checkout's whole .git, and the flows issue no sandboxed git write:
#     commits and pushes go through the wrappers the sandbox excludes, and
#     reverts use the file tool. docs/cli.md, section 6, owns that settlement.
#   * The `git clone` in `Install the pinned plugin` is the marketplace
#     checkout under $RUNNER_TEMP (THE PLUGIN PIN), not a run copy.
#
# ACTION PINS.
#   actions/checkout          v7.0.1
#   actions/setup-node        v7.0.0
#   actions/cache/restore     v6.1.0
#   actions/cache             v6.1.0
#   actions/upload-artifact   v7.0.1
# Each `uses:` names the full commit sha of the release on the comment line
# above it. Each release's own action.yml declares `runs.using: node24`, per
# a maintainer's lookups on 2026-10-21 (UTC) of each action's action.yml,
# release notes and tag: each sha is the commit its release tag names, on the
# action's default branch. Each release's README requires Actions Runner
# 2.327.1 or newer; a GitHub-hosted runner already
# has it, and a self-hosted one must run it (docs/remote-execution.md, section
# 8). A sha, not a tag: a tag is mutable, and this job holds the Claude
# credential and write tokens. A pin moves when
# `npx devscene@<version> init --upgrade-workflows` re-renders
# this file at a newer release's pins; a hand bump replaces the sha and its
# comment line together. The version stays on its own line, never trailing the
# `uses:` value: a value carrying ` #` is never a plain scalar.
#
# WHAT IT READS.
#   Secrets: CLAUDE_CODE_OAUTH_TOKEN and/or ANTHROPIC_API_KEY (one is required;
#     billing follows the API key when both are set), DEVSCENE_GIT_TOKEN (optional:
#     a personal or App token, read only by `open` and `deliver`; it opens the
#     run's draft pull request when the run starts and flips it ready for review
#     at completion, `deliver` opening one only when none is open, so your CI
#     runs on `opened` and on `ready_for_review` without an approval click. The
#     `run` job's pushes use GITHUB_TOKEN, so they trigger no CI, and no push
#     from this workflow can carry a `.github/workflows/` edit: A WORKFLOW-FILE
#     CHANGE CANNOT BE PUSHED FROM THIS WORKFLOW below), DEVSCENE_PUSH_URL
#     (optional notifications).
#   Variables: DEVSCENE_RUNNER, DEVSCENE_REMOTE_STOP (any value stops every job
#     before it launches anything), DEVSCENE_RUN_ACTORS (THE RUN-ACTOR GATE),
#     DEVSCENE_STEP_TIMEOUT_MINUTES,
#     DEVSCENE_SELF_PAUSE_AFTER_MINUTES, DEVSCENE_MAX_CHAIN, and the watcher
#     tunables listed in the `run` job's `env:` under their own names. An unset
#     variable arrives empty and the script reading it applies its own default.
#   devscene.config.json, at run time: `scriptsDir` and whether docs retrieval
#     applies. No configured value is frozen into this file.
#
# A WORKFLOW-FILE CHANGE CANNOT BE PUSHED FROM THIS WORKFLOW. A workflow edit is
# supervised-only: push-branch.sh refuses, at the first push of every unattended
# run, local or in a job, a commit that changes a file under
# `.github/workflows/`, and the watcher fails the run at once with that reason.
# Here `run` pushes only with GITHUB_TOKEN, which could not push such a commit
# anyway. A file under any other `workflows/` directory, such as a template
# tree, is an ordinary file.
#
# THE PERMISSIONS. `permissions: {}` at workflow level grants nothing, and each
# job's own block sets every permission it does not list to `none`. Each grant
# is what that job's own steps run:
#   wrong-ref  none           it fails the dispatch from its step's `env:` alone
#   open       contents read  the default-branch checkout, and `open`'s fetch of
#                             the run's branch (forge_fetch_branch)
#              issues         `open`'s comment on the run's issue and the state
#                             label on its pull request, through the issues API
#              pull-requests  `open` lists the branch's pull requests and opens
#                             the draft one
#   run        contents       push-branch.sh pushes the branch
#              actions        remote-run.sh `restore` downloads the previous
#                             bundle, `continue` dispatches and enables the poller
#              issues         lifecycle comments and state labels, on the issue
#                             and the pull request, which both use the issues API
#              pull-requests  `continue` (through notify) and the cancelled
#                             job's `report` reach forge_report, whose
#                             forge_pr_var lists the run's pull request
#   deliver    contents read  the default-branch checkout, and `deliver`'s fetch
#                             of the run's branch (forge_fetch_branch)
#              actions read   `Download the state bundle` downloads this run's
#                             bundle
#              issues         `deliver`'s `completed` comment and state labels,
#                             through the issues API
#              pull-requests  `deliver` lists, opens and updates the pull
#                             request and flips it ready, first running `gh pr
#                             ready --undo` on a ready one when HARNESS_PR_TOKEN
#                             is set: the flip and the re-toggle, one grant
#   collect    contents       `collect` runs `review`, whose hr_push_landed
#                             pushes the round through push-branch.sh
#              actions        the settledness read lists runs and downloads the
#                             bundle; `review` dispatches the round (verb_dispatch)
#              issues         forge_report's `round` and `not_started` comments
#                             and labels, collect_notify's comment, and the label
#                             create forge_set_state retries with
#              pull-requests  forge_pr_var and round_collect read the pull
#                             request's reviews and comments, and `round` runs
#                             `gh pr ready --undo` on a ready pull request
#   warm       contents read  the checkout. Its actions/cache restore and save
#                             use the runner's cache token, not GITHUB_TOKEN, and
#                             its `init` calls no GitHub API
# A grant narrower than a job's need fails only on GitHub, never locally.
#
# THE CHECKOUT CREDENTIAL. The `open`, `deliver` and `collect` checkouts persist
# GITHUB_TOKEN, and none of those jobs runs an agent: `open` and `deliver` fetch
# the run's branch with it, and `collect` also pushes through push-branch.sh
# with it, so zizmor's `artipacked` finding stands on those three. The `warm`
# and `run` checkouts set `persist-credentials: false`: `warm` pushes nothing,
# and `run`'s agent session works in its checkout, so its .git/config holds no
# credential. `run` still pushes with GITHUB_TOKEN, through push-branch.sh:
# `Store the push credential outside the checkout` (`remote-run.sh
# push-credential store`) writes one path-scoped entry to ~/.git-credentials and
# names that file by absolute path in the checkout's `credential.<url>.helper`
# (`store --file <path>`), and `Erase the push credential`, the job's last step,
# removes the entry and the keys. The sandbox and the file tools are read-denied
# that file by derivation from the profile: its `sandbox.credentials.files`
# entry and that entry's `Read` deny pair, the mechanism
# S1 (runner) and S2 (runner) measured **pass** on ~/.ssh
# (docs/sandbox-verification.md). Those rows measure the mechanism, not this
# file: the direct measurement on ~/.git-credentials is still owed. The one upload, `Upload
# the state bundle`, takes its path from the runner's temp directory, outside
# GITHUB_WORKSPACE, so no artifact carries the checkout's .git/config. An edit
# keeps it so: never point an upload-artifact `path:` inside the workspace while
# a checkout persists its credential.
#
# THE JOB TOKEN AND THE SESSION. The `run` job's job-level GH_TOKEN (GITHUB_TOKEN)
# and DEVSCENE_PUSH_URL reach the watcher's own passes: its pushes, its
# remote-run.sh calls and its notifications. The watcher strips both, and every
# `sandbox.credentials.envVars` name but the agent's own credential, from the
# agent session's environment. That is hygiene that blocks a casual read, and a
# boundary only beside the sandbox's PID namespace and no-new-privileges,
# measured on the GitHub-hosted `ubuntu-26.04` image `20261101.186.1` only
# (docs/sandbox-record.md, section 5) and unverified on other images and on
# self-hosted runners. DEVSCENE_GIT_TOKEN is referenced only by `open` and
# `deliver`, which run no agent and run the default branch's scripts.
#
# THE CLAUDE CLI. `Install the claude CLI when absent` installs
# @anthropic-ai/claude-code unpinned, and only when the runner has no `claude`.
# The latest is wanted: the agent runner tracks the model API, and
# devscene-control.yml installs it the same way but is never re-rendered by
# `--upgrade-workflows` (cli/src/generators/githubWorkflows.ts, choice 5), so a
# version frozen into the templates would stay frozen there. zizmor's
# `adhoc-packages` finding stands on it, and pinning does not clear it: it flags
# `npm install -g @anthropic-ai/claude-code@2.1.284` too, measured 2026-10-09.
# The audit-silent alternatives, `npx --yes` and `curl | bash`, are the same
# install with less integrity checking.
#
# WHY THE REPORT STEP MAY FAIL. `Open the pull request and report`, the
# `deliver` job's last step, runs `remote-run.sh deliver` on the bundle
# `Download the state bundle` fetched from the `run` job's upload, after that
# job's final push, so the pull request's head carries the run's last commit.
# It is `continue-on-error`: a repository that re-rendered this file without
# `init --force` still runs scripts with no `deliver` verb, and a finished run
# must not be marked failed for its report.
#
# WHY THE OPEN STEP RUNS ONLY WHEN chain IS 0. `Open the draft pull request`,
# the `open` job's last step, runs `remote-run.sh open` before the `run` job, so
# the run's draft pull request exists from its first job. The `open` job's
# `if:` carries `inputs.chain == 0`, and `run` is `needs: open` under
# `!cancelled()`, so a skipped or failed `open` never skips it. `chain` counts
# automatic dispatches since the last user action, so 0 is a job a person's
# action started: the first job, a resume, an answer, a round. An automatic continuation therefore never retries
# a create that failed, and the attempts per run stay bounded by people's
# actions; `deliver`'s fallback at completion is the last attempt, and its
# `completed` comment names the error. It is `continue-on-error` for the report
# step's reason above: scripts older than this file carry no `open` verb, and a
# run must not fail for its pull request.
#
# THE SELF-PAUSE POINT, MEASURED. On a hosted runner the job drops its own PAUSE
# REMOTE_SELF_PAUSE_AFTER_SECS after it started, the run yields at its next
# dispatch boundary, and `remote-run.sh continue` chains a new job.
#   Command, over this harness's own repository's main-checkout logs, 2026-09-25
#   (17 stream logs; a tool_use event with no timestamp would inherit the nearest
#   preceding one — none lacked one):
#     jq -n 'def e: .[0:19]+"Z"|fromdateiso8601; reduce inputs as $v ({f:null,t:null,s:{},d:[]}; (if .f!=input_filename then .f=input_filename|.t=null|.s={} else . end) | .t=($v.timestamp//.t) | .t as $t | if $v.type=="assistant" then reduce ($v.message.content[]? | objects | select(.type=="tool_use" and (.name=="Agent" or .name=="Task"))) as $u (.; .s[$u.id]=$t) elif $v.type=="user" then reduce ($v.message.content[]? | objects | select(.type=="tool_result")) as $r (.; if .s[$r.tool_use_id] then .d+=[($t|e)-(.s[$r.tool_use_id]|e)] | del(.s[$r.tool_use_id]) else . end) else . end) | .d|sort|length as $n|{dispatches:$n,longest_min:(.[-1]/60),p95_min:(.[(($n*95+99)/100|floor)-1]/60)}' harness-runs/autonomous_logs/*.stream.jsonl
#   Figures: 957 sub-agent dispatches; longest 73.05 min; 95th percentile 15.5 min.
#   Margin: 73.05 rounded up to the next 15 (75) plus 15 for the pause
#   bookkeeping and the post-steps = 90 min (HARNESS_SELF_PAUSE_MARGIN_MINUTES).
#   Hosted step timeout: the 360-minute hosted job limit minus a 30-minute
#   allowance for the steps around it = 330. Default self-pause: 330 - 90 = 240
#   minutes, floored at 60 when a smaller step timeout is configured. A dispatch
#   longer than the window left after the self-pause costs its in-flight unit:
#   the step timeout kills it, and the continuation resumes from the pushed ledger.
# On a self-hosted runner the self-pause is left UNSET (disabled, not merely
# unreached) and the step timeout defaults to the 5-day self-hosted job limit
# minus the same allowance. HARNESS_JOB_DEADLINE_EPOCH is the job's start plus
# the step timeout. The job-level timeout-minutes is the self-hosted limit; a
# hosted job is stopped at its own limit whatever that says.
#
# WHY THE TIMEOUT IS COMPUTED INTO GITHUB_ENV. The first step computes every
# budget value from `runner.environment` into GITHUB_ENV, so the harness step's
# timeout-minutes reads a single `env` value rather than an expression over the
# runner kind. Gate 12 round 2, on 2026-09-29, found every devscene-run.yml run
# accepted and its `Run DevScene` step run: the expression-valued
# timeout-minutes is accepted.
#
# THE PLUGIN PIN. The job clones the marketplace repository at the release tag
# devscene--v<DEVSCENE_CLI_VERSION> (docs/development.md, section 7)
# and adds the clone as a directory source, so what it installs is the tag's
# plugin whatever the default branch carries. Both the add and the install run
# from $RUNNER_TEMP, outside the checkout, so the committed .claude/settings.json's
# project-scope entry of the same name is not in view while installing. The
# clone is the plugin's runtime root and the runner's cache is its install
# root; `init --plugin-root-entries` grants both and `doctor --remote-job` grades both. The check after install
# stays as the guard: the job refuses to run, naming both versions and the
# upgrade route, when `claude plugin list --json` reports another version. What
# the agent-runner CLI was measured to accept is recorded in
# docs/remote-execution.md, section 6.
#
# THE SANDBOX PREREQUISITES. The generated profile sets `failIfUnavailable`, so
# on a runner without `bubblewrap` or `socat` the agent session would end at
# startup. `Install the sandbox prerequisites` installs them where the runner
# lets it (root or passwordless sudo). Where Ubuntu 26.04's stock
# `bwrap-userns-restrict` profile exists, it disables it (a symlink in the
# AppArmor disable directory, then `apparmor_parser -R`): that profile confines
# bwrap's children under `unpriv_bwrap` and wins over ours. It writes our
# `bwrap` profile where the stock one exists or Ubuntu 24.04's policy would
# block unprivileged user namespaces, and loads it with `apparmor_parser -r`.
# Then, on Linux, it always verifies that bwrap's child can itself create a
# user namespace, and a failed verification fails the job unless
# `sandbox.optOut` is taken, so `Run DevScene` never starts a session that
# cannot run Bash: no step from this one to `Run DevScene` carries a status
# function. What still runs after that failure: the `run` job's bundle-saving
# and reporting steps, and the `deliver` and `collect` jobs, both `needs:` it
# under `!cancelled()`. The `run` job has started, so remote-run.sh's
# `run_not_started_var` answers `started` and `collect` passes through its
# ordinary stops, exactly as after a failed `Preflight with doctor`. The run's
# one notification is `Continue, wait or stop`: `continue` with no
# `status.json` sends one `failed` naming the run URL and dispatches nothing,
# and the `deliver` job's `Open the pull request and report` runs `deliver`,
# which sends nothing.
# The step ran in Gate 12 round 13 (2026-11-05), where the stock profile
# defeated it; the fixed step passed in rounds 14-16 and its failing arm was
# taken in round 17 (docs/sandbox-verification.md, section 9).
#
# WHY retention-days IS SET. The `harness-state` bundle is the only remote copy
# of a run's clarifications, uncommitted planning drafts and carried counts; a
# run parked or paused longer than its retention cannot be answered and loses
# those drafts and counts. 400 is the
# largest retention any repository can configure, and `actions/upload-artifact`
# caps a larger `retention-days` at the repository's own maximum, so the value
# means "as long as this repository allows" — the same bound as leaving it
# unset. It is explicit so that lowering it is a visible edit. The real bound is
# the repository's Artifact and log retention setting, which
# `devscene doctor --check-github` reads. Gate 12 round 2, on
# 2026-09-29, observed the cap rather than a rejection on `actions/upload-artifact@v4`:
# the artifact's `expires_at` fell 90 days after its creation, with the
# repository's artifact-and-log-retention at {"days":90,"maximum_allowed_days":400}.
# That was v4; the v7 pinned above has not yet been observed by a gate round.

name: devscene-run
run-name: devscene ${{ inputs.action }} ${{ inputs.branch }}

on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        required: true
        type: choice
        options:
          - run
          - pause
          - warm
          - stop
      branch:
        description: The run's branch
        required: true
        type: string
      engine:
        description: Which flow runs
        required: false
        type: choice
        default: task
        options:
          - task
          - user_review
          - docs
      resume:
        description: How the run resumes
        required: false
        type: choice
        default: none
        options:
          - none
          - answer
          - pause
      answers:
        description: Clarification answers, a JSON object
        required: false
        type: string
        default: '{}'
      park_loop_clear:
        description: Clear the park-loop count
        required: false
        type: boolean
        default: false
      chain:
        description: Automatic dispatches since the last user action
        required: false
        type: number
        default: 0

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  wrong-ref:
    if: (inputs.action == 'run' || inputs.action == 'pause') && github.ref_name != inputs.branch
    runs-on: ${{ vars.DEVSCENE_RUNNER || 'ubuntu-latest' }}
    permissions: {}
    steps:
      - name: Refuse a dispatch from another ref
        env:
          IN_REF: ${{ github.ref_name }}
          IN_BRANCH: ${{ inputs.branch }}
        run: |
          echo "::error::this run was dispatched from '$IN_REF', but its branch input is '$IN_BRANCH': GitHub lists a run under the ref it was dispatched from, so no lookup of '$IN_BRANCH' would find it. Run the workflow again with Use workflow from set to '$IN_BRANCH'."
          exit 1

  open:
    if: inputs.action == 'run' && github.ref_name == inputs.branch && inputs.chain == 0
    runs-on: ${{ vars.DEVSCENE_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      HARNESS_REMOTE_SLUG: ${{ github.repository }}
      HARNESS_INPUT_BRANCH: ${{ inputs.branch }}
      DEVSCENE_REMOTE_STOP: ${{ vars.DEVSCENE_REMOTE_STOP }}
      DEVSCENE_RUN_ACTORS: ${{ vars.DEVSCENE_RUN_ACTORS }}
    steps:
      - name: Refuse an actor not on DEVSCENE_RUN_ACTORS before opening
        env:
          IN_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          IN_OWNER: ${{ github.repository_owner }}
          IN_OWNER_TYPE: ${{ github.event.repository.owner.type }}
        run: |
          actor="$IN_TRIGGERING_ACTOR"
          if [ "$actor" = 'github-actions[bot]' ]; then
            echo "@$actor passes: every harness dispatch is made with GITHUB_TOKEN and names it."
            exit 0
          fi
          lower() { printf '%s' "$1" | tr '[:upper:]' '[:lower:]'; }
          want=$(lower "$actor")
          rest="${DEVSCENE_RUN_ACTORS-},"
          listed=""
          while [ -n "$rest" ]; do
            entry="${rest%%,*}"
            rest="${rest#*,}"
            entry="${entry#"${entry%%[![:space:]]*}"}"
            entry="${entry%"${entry##*[![:space:]]}"}"
            [ -n "$entry" ] || continue
            listed=1
            if [ "$entry" = '*' ]; then
              echo "@$actor passes: DEVSCENE_RUN_ACTORS carries *, which admits every writer."
              exit 0
            fi
            if [ -n "$want" ] && [ "$(lower "$entry")" = "$want" ]; then
              echo "@$actor passes: listed in DEVSCENE_RUN_ACTORS."
              exit 0
            fi
          done
          if [ -n "$listed" ]; then
            why="@${actor:-(no actor)} is not listed in it."
          elif [ "$IN_OWNER_TYPE" = User ] && [ -n "$IN_OWNER" ]; then
            if [ -n "$want" ] && [ "$(lower "$IN_OWNER")" = "$want" ]; then
              echo "@$actor passes: DEVSCENE_RUN_ACTORS is unset, which admits the owner of this user-owned repository alone."
              exit 0
            fi
            why="it is unset, which admits the owner of this user-owned repository, @$IN_OWNER, alone, and @${actor:-(no actor)} is not that owner."
          else
            why="it is unset, and this repository has no single owner to admit (its owner type is ${IN_OWNER_TYPE:-unreadable}), so it admits nobody."
          fi
          echo "::error::@${actor:-(no actor)} dispatched or re-ran this run, and the repository variable DEVSCENE_RUN_ACTORS does not admit them: $why Nothing was launched and no credential was read. Add the login to the comma-separated repository variable DEVSCENE_RUN_ACTORS, or set it to * for every writer (docs/remote-execution.md, section 7 step 4, and section 11)."
          exit 1

      - name: Stop when DEVSCENE_REMOTE_STOP is set before opening
        run: |
          if [ -n "$DEVSCENE_REMOTE_STOP" ]; then
            echo "HARNESS_STOPPED=1" >> "$GITHUB_ENV"
            echo "::notice::DEVSCENE_REMOTE_STOP is set: nothing is launched."
          fi

      - name: Check out the default branch for opening
        if: env.HARNESS_STOPPED != '1'
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ github.token }}
          fetch-depth: 0

      - name: Check for jq and gh before opening
        if: env.HARNESS_STOPPED != '1'
        run: |
          missing=""
          for tool in jq gh; do
            command -v "$tool" >/dev/null 2>&1 || missing="$missing $tool"
          done
          if [ -n "$missing" ]; then
            echo "::error::this runner lacks:$missing. Install them on the self-hosted runner, or use a GitHub-hosted one."
            exit 1
          fi

      - name: Read the configuration for opening
        if: env.HARNESS_STOPPED != '1'
        run: |
          scripts_dir=$(jq -r '.scriptsDir // "devscene-scripts"' devscene.config.json)
          echo "SCRIPTS_DIR=${scripts_dir%/}" >> "$GITHUB_ENV"

      - name: Open the draft pull request
        if: env.HARNESS_STOPPED != '1'
        continue-on-error: true
        env:
          HARNESS_PR_TOKEN: ${{ secrets.DEVSCENE_GIT_TOKEN }}
        run: bash "$SCRIPTS_DIR/remote-run.sh" open "$HARNESS_INPUT_BRANCH"

  run:
    needs: open
    if: ${{ !cancelled() && inputs.action == 'run' && github.ref_name == inputs.branch }}
    runs-on: ${{ vars.DEVSCENE_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: write
      actions: write
      issues: write
      pull-requests: write
    # The self-hosted job limit, 5 days; a hosted job stops at its own limit.
    timeout-minutes: 7200
    concurrency:
      group: harness-run-${{ inputs.branch }}
      cancel-in-progress: false
    env:
      DEVSCENE_CLI_VERSION: '{{cliVersion}}'
      HARNESS_JOB_MODE: '1'
      HARNESS_REMOTE_SLUG: ${{ github.repository }}
      HARNESS_GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      HARNESS_INPUT_BRANCH: ${{ inputs.branch }}
      HARNESS_INPUT_ENGINE: ${{ inputs.engine }}
      HARNESS_INPUT_RESUME: ${{ inputs.resume }}
      HARNESS_INPUT_ANSWERS: ${{ inputs.answers }}
      HARNESS_INPUT_PARK_LOOP_CLEAR: ${{ inputs.park_loop_clear }}
      HARNESS_INPUT_CHAIN: ${{ inputs.chain }}
      DEVSCENE_REMOTE_STOP: ${{ vars.DEVSCENE_REMOTE_STOP }}
      DEVSCENE_RUN_ACTORS: ${{ vars.DEVSCENE_RUN_ACTORS }}
      DEVSCENE_MAX_CHAIN: ${{ vars.DEVSCENE_MAX_CHAIN }}
      STALL_WARN_SECS: ${{ vars.STALL_WARN_SECS }}
      STALL_KILL_SECS: ${{ vars.STALL_KILL_SECS }}
      STALL_MAX_RESTARTS: ${{ vars.STALL_MAX_RESTARTS }}
      USAGE_PAUSE_TRIGGER: ${{ vars.USAGE_PAUSE_TRIGGER }}
      USAGE_WARNING_DEBOUNCE: ${{ vars.USAGE_WARNING_DEBOUNCE }}
      USAGE_RESUME_MARGIN_SECS: ${{ vars.USAGE_RESUME_MARGIN_SECS }}
      USAGE_SEVEN_DAY_PAUSE_PCT: ${{ vars.USAGE_SEVEN_DAY_PAUSE_PCT }}
      PARK_LOOP_MAX_CYCLES: ${{ vars.PARK_LOOP_MAX_CYCLES }}
      REMOTE_WAIT_MAX_SECS: ${{ vars.REMOTE_WAIT_MAX_SECS }}
      REMOTE_AUTO_RESUME_MAX: ${{ vars.REMOTE_AUTO_RESUME_MAX }}
      REMOTE_AUTO_RESUME_DELAY_SECS: ${{ vars.REMOTE_AUTO_RESUME_DELAY_SECS }}
      REMOTE_CONTROL_POLL_SECS: ${{ vars.REMOTE_CONTROL_POLL_SECS }}
      DEVSCENE_PUSH_URL: ${{ secrets.DEVSCENE_PUSH_URL }}
      GH_TOKEN: ${{ github.token }}
      HARNESS_HOSTED_JOB_LIMIT_MINUTES: '360'
      HARNESS_SELF_HOSTED_JOB_LIMIT_MINUTES: '7200'
      HARNESS_STEP_ALLOWANCE_MINUTES: '30'
      HARNESS_SELF_PAUSE_MARGIN_MINUTES: '90'
    steps:
      - name: Refuse an actor not on DEVSCENE_RUN_ACTORS
        env:
          IN_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          IN_OWNER: ${{ github.repository_owner }}
          IN_OWNER_TYPE: ${{ github.event.repository.owner.type }}
        run: |
          actor="$IN_TRIGGERING_ACTOR"
          if [ "$actor" = 'github-actions[bot]' ]; then
            echo "@$actor passes: every harness dispatch is made with GITHUB_TOKEN and names it."
            exit 0
          fi
          lower() { printf '%s' "$1" | tr '[:upper:]' '[:lower:]'; }
          want=$(lower "$actor")
          rest="${DEVSCENE_RUN_ACTORS-},"
          listed=""
          while [ -n "$rest" ]; do
            entry="${rest%%,*}"
            rest="${rest#*,}"
            entry="${entry#"${entry%%[![:space:]]*}"}"
            entry="${entry%"${entry##*[![:space:]]}"}"
            [ -n "$entry" ] || continue
            listed=1
            if [ "$entry" = '*' ]; then
              echo "@$actor passes: DEVSCENE_RUN_ACTORS carries *, which admits every writer."
              exit 0
            fi
            if [ -n "$want" ] && [ "$(lower "$entry")" = "$want" ]; then
              echo "@$actor passes: listed in DEVSCENE_RUN_ACTORS."
              exit 0
            fi
          done
          if [ -n "$listed" ]; then
            why="@${actor:-(no actor)} is not listed in it."
          elif [ "$IN_OWNER_TYPE" = User ] && [ -n "$IN_OWNER" ]; then
            if [ -n "$want" ] && [ "$(lower "$IN_OWNER")" = "$want" ]; then
              echo "@$actor passes: DEVSCENE_RUN_ACTORS is unset, which admits the owner of this user-owned repository alone."
              exit 0
            fi
            why="it is unset, which admits the owner of this user-owned repository, @$IN_OWNER, alone, and @${actor:-(no actor)} is not that owner."
          else
            why="it is unset, and this repository has no single owner to admit (its owner type is ${IN_OWNER_TYPE:-unreadable}), so it admits nobody."
          fi
          echo "::error::@${actor:-(no actor)} dispatched or re-ran this run, and the repository variable DEVSCENE_RUN_ACTORS does not admit them: $why Nothing was launched and no credential was read. Add the login to the comma-separated repository variable DEVSCENE_RUN_ACTORS, or set it to * for every writer (docs/remote-execution.md, section 7 step 4, and section 11)."
          exit 1

      - name: Compute the time budget
        env:
          IN_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          IN_STEP_TIMEOUT: ${{ vars.DEVSCENE_STEP_TIMEOUT_MINUTES }}
          IN_SELF_PAUSE: ${{ vars.DEVSCENE_SELF_PAUSE_AFTER_MINUTES }}
        run: |
          started=$(date +%s)
          kind="${IN_RUNNER_ENVIRONMENT:-${RUNNER_ENVIRONMENT:-github-hosted}}"
          positive() { case "$1" in ''|*[!0-9]*) return 1 ;; esac; [ "$1" -gt 0 ]; }
          if [ "$kind" = self-hosted ]; then
            limit="$HARNESS_SELF_HOSTED_JOB_LIMIT_MINUTES"
          else
            limit="$HARNESS_HOSTED_JOB_LIMIT_MINUTES"
          fi
          step="${IN_STEP_TIMEOUT:-$((limit - HARNESS_STEP_ALLOWANCE_MINUTES))}"
          if ! positive "$step"; then
            echo "::error::DEVSCENE_STEP_TIMEOUT_MINUTES must be a positive integer, got '$step'"
            exit 1
          fi
          {
            echo "HARNESS_JOB_STARTED_EPOCH=$started"
            echo "DEVSCENE_STEP_TIMEOUT_MINUTES=$step"
            echo "HARNESS_JOB_DEADLINE_EPOCH=$((started + step * 60))"
          } >> "$GITHUB_ENV"
          if [ "$kind" != self-hosted ]; then
            pause="${IN_SELF_PAUSE:-$((step - HARNESS_SELF_PAUSE_MARGIN_MINUTES))}"
            if [ -z "$IN_SELF_PAUSE" ] && [ "$pause" -lt 60 ]; then pause=60; fi
            if ! positive "$pause"; then
              echo "::error::DEVSCENE_SELF_PAUSE_AFTER_MINUTES must be a positive integer, got '$pause'"
              exit 1
            fi
            echo "REMOTE_SELF_PAUSE_AFTER_SECS=$((pause * 60))" >> "$GITHUB_ENV"
            echo "runner $kind: step timeout ${step} min, self-pause after ${pause} min"
          else
            echo "runner $kind: step timeout ${step} min, self-pause disabled"
          fi

      - name: Stop when DEVSCENE_REMOTE_STOP is set
        run: |
          if [ -n "$DEVSCENE_REMOTE_STOP" ]; then
            echo "HARNESS_STOPPED=1" >> "$GITHUB_ENV"
            echo "::notice::DEVSCENE_REMOTE_STOP is set: nothing is launched."
          fi

      - name: Check out the run's branch
        if: env.HARNESS_STOPPED != '1'
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          token: ${{ github.token }}
          persist-credentials: false

      - name: Check for jq and gh
        if: env.HARNESS_STOPPED != '1'
        run: |
          missing=""
          for tool in jq gh; do
            command -v "$tool" >/dev/null 2>&1 || missing="$missing $tool"
          done
          if [ -n "$missing" ]; then
            echo "::error::this runner lacks:$missing. Install them on the self-hosted runner, or use a GitHub-hosted one."
            exit 1
          fi

      - name: Set up Node
        if: env.HARNESS_STOPPED != '1'
        # actions/setup-node v7.0.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          # v5 caches by package.json's packageManager; the job installs nothing through npm's cache, and a lockfile-less repository must not fail this step.
          package-manager-cache: false

      - name: Refuse a branch that changed the job's own files
        if: env.HARNESS_STOPPED != '1'
        working-directory: ${{ runner.temp }}
        run: |
          npx --yes "devscene@$DEVSCENE_CLI_VERSION" doctor --cwd "$GITHUB_WORKSPACE" --job-surfaces="$HARNESS_GITHUB_DEFAULT_BRANCH" \
            || { echo "::error::this branch's own commits changed files the job runs or loads, named in this step's doctor report; nothing from it runs in this job."; exit 1; }

      - name: Record the default branch's commit
        if: env.HARNESS_STOPPED != '1'
        run: |
          sha=$(git -C "$GITHUB_WORKSPACE" rev-parse --verify --quiet "refs/remotes/origin/$HARNESS_GITHUB_DEFAULT_BRANCH^{commit}") || { echo "::error::cannot read the default branch's commit from the job's fresh checkout; nothing from this branch runs in this job."; exit 1; }
          echo "HARNESS_GITHUB_DEFAULT_COMMIT=$sha" >> "$GITHUB_ENV"
          default_branch=$(git -C "$GITHUB_WORKSPACE" show "$sha:devscene.config.json" | jq -r '.defaultBranch // empty') && [ -n "$default_branch" ] || { echo "::error::cannot read defaultBranch from the default branch's devscene.config.json; nothing from this branch runs in this job."; exit 1; }
          base=$(git -C "$GITHUB_WORKSPACE" rev-parse --verify --quiet "refs/remotes/origin/$default_branch^{commit}") || { echo "::error::cannot read origin/$default_branch's commit from the job's fresh checkout; nothing from this branch runs in this job."; exit 1; }
          echo "HARNESS_DEFAULT_BRANCH_COMMIT=$base" >> "$GITHUB_ENV"

      - name: Read the configuration
        id: config
        if: env.HARNESS_STOPPED != '1'
        run: |
          scripts_dir=$(jq -r '.scriptsDir // "devscene-scripts"' devscene.config.json)
          retrieval=$(jq -r '(.phases.docs == true and .docs.retrieval == true)' devscene.config.json)
          {
            echo "SCRIPTS_DIR=${scripts_dir%/}"
            echo "HARNESS_RETRIEVAL_CACHE=${XDG_CACHE_HOME:-$HOME/.cache}/devscene/retrieval"
          } >> "$GITHUB_ENV"
          echo "retrieval=$retrieval" >> "$GITHUB_OUTPUT"

      - name: Install the claude CLI when absent
        if: env.HARNESS_STOPPED != '1'
        working-directory: ${{ runner.temp }}
        run: |
          if ! command -v claude >/dev/null 2>&1; then
            npm install -g @anthropic-ai/claude-code
          fi
          claude --version

      - name: Check the credentials
        if: env.HARNESS_STOPPED != '1'
        env:
          IN_OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          IN_API: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$IN_OAUTH" ] && [ -z "$IN_API" ]; then
            echo "::error::neither the CLAUDE_CODE_OAUTH_TOKEN nor the ANTHROPIC_API_KEY repository secret is set; set one."
            exit 1
          fi

      - name: Set the git identity
        if: env.HARNESS_STOPPED != '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Store the push credential outside the checkout
        if: env.HARNESS_STOPPED != '1'
        run: bash "$SCRIPTS_DIR/remote-run.sh" push-credential store

      - name: Install the pinned plugin
        if: env.HARNESS_STOPPED != '1'
        run: |
          source_repo=$(jq -r '.extraKnownMarketplaces["devscene"].source.repo // empty' .claude/settings.json 2>/dev/null || true)
          if [ -z "$source_repo" ]; then
            echo "::error::.claude/settings.json names no marketplace source for devscene. Run init locally with --marketplace <owner>/<repo> and commit the file."
            exit 1
          fi
          upgrade_route="to run another version, re-render this repository's workflows with 'npx devscene@<version> init --upgrade-workflows', then commit the paths its printed 'git add' names and push them to the default branch (docs/remote-execution.md, section 7, Upgrading)"
          tag="devscene--v$DEVSCENE_CLI_VERSION"
          marketplace_dir="$RUNNER_TEMP/harness-marketplace"
          # --quiet does not cover the detached-HEAD advice a tag checkout prints; only advice.detachedHead gates it.
          if ! git -c advice.detachedHead=false clone --quiet --depth 1 --branch "$tag" "https://github.com/$source_repo.git" "$marketplace_dir"; then
            echo "::error::$source_repo has no release tag $tag, so the plugin this workflow was rendered for cannot be installed. If $DEVSCENE_CLI_VERSION was released, its release is missing the tag; otherwise, $upgrade_route."
            exit 1
          fi
          (cd "$RUNNER_TEMP" && claude plugin marketplace add ./harness-marketplace && claude plugin install devscene@devscene)
          installed=$(claude plugin list --json | jq -r '[.[] | select(.id == "devscene@devscene" and .scope == "user")][0].version // empty')
          if [ "$installed" != "$DEVSCENE_CLI_VERSION" ]; then
            echo "::error::the installed plugin is version '${installed:-none}', but this workflow was rendered for $DEVSCENE_CLI_VERSION and cloned $tag; $upgrade_route."
            exit 1
          fi

      - name: Restore the docs-retrieval cache
        if: env.HARNESS_STOPPED != '1' && steps.config.outputs.retrieval == 'true'
        # actions/cache/restore v6.1.0
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.HARNESS_RETRIEVAL_CACHE }}
          key: harness-retrieval-${{ runner.os }}-${{ env.DEVSCENE_CLI_VERSION }}

      - name: Generate the job's permission profile
        if: env.HARNESS_STOPPED != '1'
        working-directory: ${{ runner.temp }}
        run: |
          npx --yes "devscene@$DEVSCENE_CLI_VERSION" --cwd "$GITHUB_WORKSPACE" init --plugin-root-entries
          changed=$(git -C "$GITHUB_WORKSPACE" status --porcelain --untracked-files=no)
          if [ -n "$changed" ]; then
            printf '%s\n' "$changed"
            echo "::error::init $DEVSCENE_CLI_VERSION changed tracked files. Run 'npx devscene@$DEVSCENE_CLI_VERSION init' locally and commit the result."
            exit 1
          fi

      - name: Install the sandbox prerequisites
        if: env.HARNESS_STOPPED != '1'
        run: |
          sysctl_file=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          profile=/etc/apparmor.d/bwrap
          stock=/etc/apparmor.d/bwrap-userns-restrict
          disable_dir=/etc/apparmor.d/disable
          missing=()
          command -v bwrap >/dev/null 2>&1 || missing+=(bubblewrap)
          command -v socat >/dev/null 2>&1 || missing+=(socat)
          needs_profile=0
          if [ -r "$sysctl_file" ] && [ "$(cat "$sysctl_file")" = 1 ]; then
            if [ ! -f "$profile" ] || ! grep -q '^[[:space:]]*userns,' "$profile"; then
              needs_profile=1
            fi
          fi
          stock_found=0
          stock_state="was not found"
          if [ -e "$stock" ]; then
            stock_found=1
            needs_profile=1
            stock_state="was found but not disabled"
          fi
          profile_state="was not needed"
          if [ "$needs_profile" = 1 ]; then
            profile_state="was needed but not written"
          fi
          if [ "${#missing[@]}" -eq 0 ] && [ "$needs_profile" = 0 ]; then
            echo "The sandbox prerequisites are present."
          else
            if [ "$(uname -s)" != Linux ]; then
              echo "::warning::not a Linux runner, so nothing was installed; missing packages: ${missing[*]:-none}."
              exit 0
            fi
            can_change=1
            if [ "$(id -u)" = 0 ]; then
              as_root=()
            elif sudo -n true >/dev/null 2>&1; then
              as_root=(sudo -n)
            else
              can_change=0
              echo "::warning::no root and no passwordless sudo on this runner, so nothing was installed; missing packages: ${missing[*]:-none}; bwrap AppArmor profile needed: $needs_profile."
            fi
            if [ "$can_change" = 1 ] && [ "${#missing[@]}" -gt 0 ]; then
              if command -v apt-get >/dev/null 2>&1; then
                if ! { "${as_root[@]}" apt-get update -qq && "${as_root[@]}" apt-get install -y -qq "${missing[@]}"; }; then
                  echo "::warning::apt-get could not install ${missing[*]}."
                fi
              elif command -v dnf >/dev/null 2>&1; then
                if ! "${as_root[@]}" dnf install -y "${missing[@]}"; then
                  echo "::warning::dnf could not install ${missing[*]}."
                fi
              else
                echo "::warning::neither apt-get nor dnf is on this runner, so ${missing[*]} was not installed."
              fi
            fi
            if [ "$can_change" = 1 ] && [ "$stock_found" = 1 ]; then
              stock_ok=1
              if ! "${as_root[@]}" mkdir -p "$disable_dir"; then
                stock_ok=0
                echo "::warning::mkdir -p $disable_dir failed."
              fi
              if ! "${as_root[@]}" ln -sf "$stock" "$disable_dir/bwrap-userns-restrict"; then
                stock_ok=0
                echo "::warning::ln -sf $stock $disable_dir/bwrap-userns-restrict failed."
              fi
              if ! "${as_root[@]}" apparmor_parser -R "$stock"; then
                stock_ok=0
                echo "::warning::apparmor_parser -R $stock failed."
              fi
              if [ "$stock_ok" = 1 ]; then
                stock_state="was disabled"
              fi
            fi
            if [ "$can_change" = 1 ] && [ "$needs_profile" = 1 ]; then
              if "${as_root[@]}" tee "$profile" >/dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>

          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,

            include if exists <local/bwrap>
          }
          PROFILE
              then
                if "${as_root[@]}" apparmor_parser -r "$profile"; then
                  profile_state="was written and loaded"
                else
                  profile_state="was written but not loaded"
                  echo "::warning::apparmor_parser -r $profile failed after writing it."
                fi
              else
                echo "::warning::could not write $profile."
              fi
            fi
          fi
          if [ "$(uname -s)" = Linux ]; then
            nl=$(printf '\n_')
            nl=${nl%_}
            attr="not read, the check did not run"
            check_ok=0
            if ! command -v bwrap >/dev/null 2>&1; then
              check_err="bwrap not on PATH"
            elif ! command -v unshare >/dev/null 2>&1; then
              check_err="unshare not on PATH"
            elif check_err=$(bwrap --unshare-user --dev-bind / / -- unshare -U -r true 2>&1 >/dev/null); then
              check_ok=1
            else
              attr=$(bwrap --unshare-user --dev-bind / / -- cat /proc/self/attr/current 2>&1) || true
              attr=${attr:-empty}
            fi
            if [ "$check_ok" = 1 ]; then
              echo "Ubuntu's bwrap-userns-restrict $stock_state; the bwrap AppArmor profile $profile_state; the nested user-namespace check inside bwrap passed."
              exit 0
            fi
            if [ -n "${SCRIPTS_DIR-}" ] && [ -f "$SCRIPTS_DIR/lib/harness-run-lib.sh" ] && ( . "$SCRIPTS_DIR/lib/harness-run-lib.sh" && hr_sandbox_opted_out "$PWD" ); then
              echo "::warning::bwrap's child cannot create a user namespace, so the sandbox cannot run on this runner, but sandbox.optOut is taken, so the job goes on. Check stderr: ${check_err//$nl/ }."
              exit 0
            fi
            notes=""
            if [ "$stock_found" = 1 ]; then
              notes=" Ubuntu's bwrap-userns-restrict $stock_state."
            fi
            if [ "$check_err" = "bwrap not on PATH" ]; then
              still_missing=""
              command -v socat >/dev/null 2>&1 || still_missing=" socat"
              notes="$notes Packages still missing: bubblewrap$still_missing."
            fi
            echo "::error::bwrap's child cannot create a user namespace, so every sandboxed command would fail; the job stops before its session. Check stderr: ${check_err//$nl/ }. bwrap's child confinement (/proc/self/attr/current): ${attr//$nl/ }.$notes"
            exit 1
          fi

      - name: Preflight with doctor
        if: env.HARNESS_STOPPED != '1'
        working-directory: ${{ runner.temp }}
        run: npx --yes "devscene@$DEVSCENE_CLI_VERSION" doctor --cwd "$GITHUB_WORKSPACE" --remote-job

      - name: Bootstrap the checkout
        if: env.HARNESS_STOPPED != '1'
        run: bash "$SCRIPTS_DIR/setup-worktree.sh"

      - name: Restore the previous job's state
        if: env.HARNESS_STOPPED != '1'
        run: bash "$SCRIPTS_DIR/remote-run.sh" restore "$HARNESS_INPUT_BRANCH" --resume "$HARNESS_INPUT_RESUME"

      - name: Run DevScene
        if: env.HARNESS_STOPPED != '1'
        timeout-minutes: ${{ fromJSON(env.DEVSCENE_STEP_TIMEOUT_MINUTES || env.HARNESS_HOSTED_JOB_LIMIT_MINUTES) }}
        env:
          IN_OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          IN_API: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$IN_OAUTH" ]; then export CLAUDE_CODE_OAUTH_TOKEN="$IN_OAUTH"; fi
          if [ -n "$IN_API" ]; then export ANTHROPIC_API_KEY="$IN_API"; fi
          unset IN_OAUTH IN_API
          bash "$SCRIPTS_DIR/autonomous-watcher.sh" job "$HARNESS_INPUT_BRANCH" "$HARNESS_INPUT_ENGINE" "$HARNESS_INPUT_RESUME"

      # A cancelled or timed-out `Run DevScene` step kills the watcher with its session, so
      # run_job's exit sweep never runs and the session's sandbox placeholders stay on disk; a
      # leftover <scriptsDir>/.git makes push-branch.sh refuse to place itself and push nothing.
      # Best-effort: it never fails the job.
      - name: Sweep the sandbox placeholders
        if: always() && env.SCRIPTS_DIR != ''
        continue-on-error: true
        run: HARNESS_JOB_MODE=1 bash "$SCRIPTS_DIR/autonomous-watcher.sh" job-sweep "$HARNESS_INPUT_BRANCH"

      # Runs under always(), so a cancelled or failed job still pushes its commits. push-branch.sh
      # pushes nothing back for a branch origin no longer has, so a run stopped by its branch's
      # deletion does not re-create it (Gate 12 round 9, finding 1). push-branch.sh must never fail
      # the job, so the step turns each refusal or given-up push line into an ::error:: annotation
      # and a job-summary line and still exits 0: in Gate 12 round 13 this step printed
      # `push-branch.sh: refusing to push: …` and concluded `success`, with nothing on the run page.
      - name: Push the branch
        if: always() && env.SCRIPTS_DIR != ''
        run: |
          log="$RUNNER_TEMP/push-branch.log"
          if ! { : > "$log"; } 2>/dev/null; then
            bash "$SCRIPTS_DIR/push-branch.sh" || true
            exit 0
          fi
          bash "$SCRIPTS_DIR/push-branch.sh" 2>&1 | tee "$log" || true
          matched=''
          while IFS= read -r line || [ -n "$line" ]; do
            case "$line" in
              *'refusing to push'*) ;;
              *'retrying in'*) continue ;;
              'push-branch.sh: push failed for '*) ;;
              *) continue ;;
            esac
            echo "::error title=Push the branch::${line//'%'/%25}"
            matched="$matched- $line"$'\n'
          done < "$log" || true
          if [ -n "$matched" ] && [ -n "$GITHUB_STEP_SUMMARY" ]; then
            { printf '### Push the branch\n\n%s' "$matched" >> "$GITHUB_STEP_SUMMARY"; } 2>/dev/null || true
          fi
          exit 0

      - name: Save the state bundle
        if: always() && env.SCRIPTS_DIR != ''
        run: bash "$SCRIPTS_DIR/remote-run.sh" save "$HARNESS_INPUT_BRANCH" "$RUNNER_TEMP/harness-state"

      - name: Upload the state bundle
        if: always() && env.SCRIPTS_DIR != ''
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: harness-state
          path: ${{ runner.temp }}/harness-state
          overwrite: true
          retention-days: 400

      - name: Continue, wait or stop
        if: ${{ !cancelled() && env.SCRIPTS_DIR != '' }}
        run: bash "$SCRIPTS_DIR/remote-run.sh" continue "$HARNESS_INPUT_BRANCH" "$RUNNER_TEMP/harness-state"

      - name: Notify a cancelled job
        if: cancelled() && env.SCRIPTS_DIR != ''
        run: |
          export HARNESS_REPO_SLUG="$HARNESS_REMOTE_SLUG"
          bash "$SCRIPTS_DIR/autonomous-notify.sh" failed "$HARNESS_INPUT_BRANCH" "" \
            "job cancelled: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || true
          bash "$SCRIPTS_DIR/remote-run.sh" report failed "$HARNESS_INPUT_BRANCH" --note "the job was cancelled: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || true

      - name: Erase the push credential
        if: always() && env.SCRIPTS_DIR != ''
        continue-on-error: true
        run: bash "$SCRIPTS_DIR/remote-run.sh" push-credential erase

  deliver:
    needs: run
    if: ${{ inputs.action == 'run' && !cancelled() && github.ref_name == inputs.branch }}
    runs-on: ${{ vars.DEVSCENE_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      HARNESS_REMOTE_SLUG: ${{ github.repository }}
      HARNESS_INPUT_BRANCH: ${{ inputs.branch }}
      DEVSCENE_REMOTE_STOP: ${{ vars.DEVSCENE_REMOTE_STOP }}
      DEVSCENE_RUN_ACTORS: ${{ vars.DEVSCENE_RUN_ACTORS }}
    steps:
      - name: Refuse an actor not on DEVSCENE_RUN_ACTORS before delivering
        env:
          IN_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          IN_OWNER: ${{ github.repository_owner }}
          IN_OWNER_TYPE: ${{ github.event.repository.owner.type }}
        run: |
          actor="$IN_TRIGGERING_ACTOR"
          if [ "$actor" = 'github-actions[bot]' ]; then
            echo "@$actor passes: every harness dispatch is made with GITHUB_TOKEN and names it."
            exit 0
          fi
          lower() { printf '%s' "$1" | tr '[:upper:]' '[:lower:]'; }
          want=$(lower "$actor")
          rest="${DEVSCENE_RUN_ACTORS-},"
          listed=""
          while [ -n "$rest" ]; do
            entry="${rest%%,*}"
            rest="${rest#*,}"
            entry="${entry#"${entry%%[![:space:]]*}"}"
            entry="${entry%"${entry##*[![:space:]]}"}"
            [ -n "$entry" ] || continue
            listed=1
            if [ "$entry" = '*' ]; then
              echo "@$actor passes: DEVSCENE_RUN_ACTORS carries *, which admits every writer."
              exit 0
            fi
            if [ -n "$want" ] && [ "$(lower "$entry")" = "$want" ]; then
              echo "@$actor passes: listed in DEVSCENE_RUN_ACTORS."
              exit 0
            fi
          done
          if [ -n "$listed" ]; then
            why="@${actor:-(no actor)} is not listed in it."
          elif [ "$IN_OWNER_TYPE" = User ] && [ -n "$IN_OWNER" ]; then
            if [ -n "$want" ] && [ "$(lower "$IN_OWNER")" = "$want" ]; then
              echo "@$actor passes: DEVSCENE_RUN_ACTORS is unset, which admits the owner of this user-owned repository alone."
              exit 0
            fi
            why="it is unset, which admits the owner of this user-owned repository, @$IN_OWNER, alone, and @${actor:-(no actor)} is not that owner."
          else
            why="it is unset, and this repository has no single owner to admit (its owner type is ${IN_OWNER_TYPE:-unreadable}), so it admits nobody."
          fi
          echo "::error::@${actor:-(no actor)} dispatched or re-ran this run, and the repository variable DEVSCENE_RUN_ACTORS does not admit them: $why Nothing was launched and no credential was read. Add the login to the comma-separated repository variable DEVSCENE_RUN_ACTORS, or set it to * for every writer (docs/remote-execution.md, section 7 step 4, and section 11)."
          exit 1

      - name: Stop when DEVSCENE_REMOTE_STOP is set before delivering
        run: |
          if [ -n "$DEVSCENE_REMOTE_STOP" ]; then
            echo "HARNESS_STOPPED=1" >> "$GITHUB_ENV"
            echo "::notice::DEVSCENE_REMOTE_STOP is set: nothing is launched."
          fi

      - name: Check out the default branch for delivering
        if: env.HARNESS_STOPPED != '1'
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ github.token }}
          fetch-depth: 0

      - name: Check for jq and gh before delivering
        if: env.HARNESS_STOPPED != '1'
        run: |
          missing=""
          for tool in jq gh; do
            command -v "$tool" >/dev/null 2>&1 || missing="$missing $tool"
          done
          if [ -n "$missing" ]; then
            echo "::error::this runner lacks:$missing. Install them on the self-hosted runner, or use a GitHub-hosted one."
            exit 1
          fi

      - name: Read the configuration for delivering
        if: env.HARNESS_STOPPED != '1'
        run: |
          scripts_dir=$(jq -r '.scriptsDir // "devscene-scripts"' devscene.config.json)
          echo "SCRIPTS_DIR=${scripts_dir%/}" >> "$GITHUB_ENV"

      # A run job refused before its upload saved no bundle; deliver then reads no status and posts nothing.
      - name: Download the state bundle
        if: env.HARNESS_STOPPED != '1'
        run: |
          if ! gh run download "$GITHUB_RUN_ID" --name harness-state --dir "$RUNNER_TEMP/harness-state"; then
            echo "::notice::this workflow run has no harness-state artifact to download, so there is nothing to deliver."
          fi
          exit 0

      - name: Open the pull request and report
        if: env.HARNESS_STOPPED != '1'
        continue-on-error: true
        env:
          HARNESS_PR_TOKEN: ${{ secrets.DEVSCENE_GIT_TOKEN }}
        run: bash "$SCRIPTS_DIR/remote-run.sh" deliver "$HARNESS_INPUT_BRANCH" "$RUNNER_TEMP/harness-state"

  collect:
    needs: [run, deliver]
    if: ${{ inputs.action == 'run' && !cancelled() && github.ref_name == inputs.branch }}
    runs-on: ${{ vars.DEVSCENE_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: write
      actions: write
      issues: write
      pull-requests: write
    concurrency:
      group: harness-review-${{ inputs.branch }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      HARNESS_REMOTE_SLUG: ${{ github.repository }}
      HARNESS_INPUT_BRANCH: ${{ inputs.branch }}
      DEVSCENE_REMOTE_STOP: ${{ vars.DEVSCENE_REMOTE_STOP }}
      DEVSCENE_TRIGGER_ALLOWED_BOTS: ${{ vars.DEVSCENE_TRIGGER_ALLOWED_BOTS }}
      DEVSCENE_RUN_ACTORS: ${{ vars.DEVSCENE_RUN_ACTORS }}
    steps:
      - name: Refuse an actor not on DEVSCENE_RUN_ACTORS before collecting
        env:
          IN_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          IN_OWNER: ${{ github.repository_owner }}
          IN_OWNER_TYPE: ${{ github.event.repository.owner.type }}
        run: |
          actor="$IN_TRIGGERING_ACTOR"
          if [ "$actor" = 'github-actions[bot]' ]; then
            echo "@$actor passes: every harness dispatch is made with GITHUB_TOKEN and names it."
            exit 0
          fi
          lower() { printf '%s' "$1" | tr '[:upper:]' '[:lower:]'; }
          want=$(lower "$actor")
          rest="${DEVSCENE_RUN_ACTORS-},"
          listed=""
          while [ -n "$rest" ]; do
            entry="${rest%%,*}"
            rest="${rest#*,}"
            entry="${entry#"${entry%%[![:space:]]*}"}"
            entry="${entry%"${entry##*[![:space:]]}"}"
            [ -n "$entry" ] || continue
            listed=1
            if [ "$entry" = '*' ]; then
              echo "@$actor passes: DEVSCENE_RUN_ACTORS carries *, which admits every writer."
              exit 0
            fi
            if [ -n "$want" ] && [ "$(lower "$entry")" = "$want" ]; then
              echo "@$actor passes: listed in DEVSCENE_RUN_ACTORS."
              exit 0
            fi
          done
          if [ -n "$listed" ]; then
            why="@${actor:-(no actor)} is not listed in it."
          elif [ "$IN_OWNER_TYPE" = User ] && [ -n "$IN_OWNER" ]; then
            if [ -n "$want" ] && [ "$(lower "$IN_OWNER")" = "$want" ]; then
              echo "@$actor passes: DEVSCENE_RUN_ACTORS is unset, which admits the owner of this user-owned repository alone."
              exit 0
            fi
            why="it is unset, which admits the owner of this user-owned repository, @$IN_OWNER, alone, and @${actor:-(no actor)} is not that owner."
          else
            why="it is unset, and this repository has no single owner to admit (its owner type is ${IN_OWNER_TYPE:-unreadable}), so it admits nobody."
          fi
          echo "::error::@${actor:-(no actor)} dispatched or re-ran this run, and the repository variable DEVSCENE_RUN_ACTORS does not admit them: $why Nothing was launched and no credential was read. Add the login to the comma-separated repository variable DEVSCENE_RUN_ACTORS, or set it to * for every writer (docs/remote-execution.md, section 7 step 4, and section 11)."
          exit 1

      - name: Check out the default branch for collecting
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ github.token }}
          fetch-depth: 0

      - name: Check for jq and gh before collecting
        run: |
          missing=""
          for tool in jq gh; do
            command -v "$tool" >/dev/null 2>&1 || missing="$missing $tool"
          done
          if [ -n "$missing" ]; then
            echo "::error::this runner lacks:$missing. Install them on the self-hosted runner, or use a GitHub-hosted one."
            exit 1
          fi

      - name: Read the configuration for collecting
        run: |
          scripts_dir=$(jq -r '.scriptsDir // "devscene-scripts"' devscene.config.json)
          echo "SCRIPTS_DIR=${scripts_dir%/}" >> "$GITHUB_ENV"

      - name: Set the git identity for collecting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Start the next round from collected reviews
        continue-on-error: true
        run: bash "$SCRIPTS_DIR/remote-run.sh" collect "$HARNESS_INPUT_BRANCH"

  warm:
    if: inputs.action == 'warm'
    runs-on: ${{ vars.DEVSCENE_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    env:
      DEVSCENE_CLI_VERSION: '{{cliVersion}}'
      DEVSCENE_REMOTE_STOP: ${{ vars.DEVSCENE_REMOTE_STOP }}
    steps:
      - name: Stop when DEVSCENE_REMOTE_STOP is set
        run: |
          if [ -n "$DEVSCENE_REMOTE_STOP" ]; then
            echo "HARNESS_STOPPED=1" >> "$GITHUB_ENV"
            echo "::notice::DEVSCENE_REMOTE_STOP is set: nothing is launched."
          fi

      - name: Check out the dispatched ref
        if: env.HARNESS_STOPPED != '1'
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Read the configuration
        id: config
        if: env.HARNESS_STOPPED != '1'
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            echo "::error::this runner lacks: jq."
            exit 1
          fi
          retrieval=$(jq -r '(.phases.docs == true and .docs.retrieval == true)' devscene.config.json)
          echo "HARNESS_RETRIEVAL_CACHE=${XDG_CACHE_HOME:-$HOME/.cache}/devscene/retrieval" >> "$GITHUB_ENV"
          echo "retrieval=$retrieval" >> "$GITHUB_OUTPUT"
          if [ "$retrieval" != true ]; then
            echo "::notice::docs retrieval does not apply to this configuration: there is no cache to warm."
          fi

      - name: Set up Node
        if: env.HARNESS_STOPPED != '1' && steps.config.outputs.retrieval == 'true'
        # actions/setup-node v7.0.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          # As in the run job: no npm cache is used, and a lockfile-less repository must not fail this step.
          package-manager-cache: false

      - name: Restore and save the docs-retrieval cache
        if: env.HARNESS_STOPPED != '1' && steps.config.outputs.retrieval == 'true'
        # actions/cache v6.1.0
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.HARNESS_RETRIEVAL_CACHE }}
          key: harness-retrieval-${{ runner.os }}-${{ env.DEVSCENE_CLI_VERSION }}

      - name: Install what is missing
        if: env.HARNESS_STOPPED != '1' && steps.config.outputs.retrieval == 'true'
        run: npx --yes "devscene@$DEVSCENE_CLI_VERSION" init
