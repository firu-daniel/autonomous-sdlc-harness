# Publish main from dev on every push to dev — so each pull request merged into dev becomes one
# commit on main. What a publication is, and the guard that refuses one, are in
# scripts/publish-main.sh. This file exists only on dev: the script removes it from what it
# publishes, and a push event runs the workflow file as it stands in the pushed commit.
name: Publish main

on:
  push:
    branches: [dev]

permissions:
  contents: write

# One publication at a time, in push order: each builds on the main the previous one pushed.
concurrency:
  group: publish-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0
      - name: Publish
        run: bash scripts/publish-main.sh
